<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Abjad Arabic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=Reem+Kufi:wght@500..700&display=swap">
<style>
/* Layout concept: app shell with a left rail on desktop and a bottom tab bar on phones.
   Teal hero panels carry a star lattice taken from the Omani poster; gold is reserved for rewards and the contest. */
:root{
  --bg:#F1F7F6; --surface:#FFFFFF; --surface2:#E7F1EF; --ink:#0F2A2C; --muted:#52706F; --line:#D3E3E0;
  --primary:#13807D; --primary-ink:#FFFFFF; --primary-soft:#D8EFEC;
  --hero1:#0B4548; --hero2:#14706F; --hero-ink:#F3FBFA;
  --gold:#E0A22A; --gold-soft:#FBEFD0; --gold-ink:#5A3B00; --gold-btn:#F0B93C; --gold-btn-ink:#3B2600;
  --good:#16825A; --good-soft:#D6F0E4; --bad:#C23B33; --bad-soft:#F9DCD9;
  --shadow:0 1px 2px rgba(10,40,42,.06),0 10px 28px rgba(10,40,42,.07);
  --ring-bg:var(--line); --ring-fg:var(--primary);
  --f-ar:'Amiri','Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
  --f-kufi:'Reem Kufi','Amiri','Noto Kufi Arabic',sans-serif;
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07181A; --surface:#0E2326; --surface2:#143034; --ink:#E5F2F0; --muted:#8CADAA; --line:#1D3F43;
  --primary:#3DBEB7; --primary-ink:#052A2B; --primary-soft:#113539;
  --hero1:#0A3C3F; --hero2:#115F5F; --hero-ink:#F3FBFA;
  --gold:#F0B843; --gold-soft:#3A2D0F; --gold-ink:#F6D88C;
  --good:#3DC48F; --good-soft:#0F3A2B; --bad:#F0756D; --bad-soft:#40201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07181A; --surface:#0E2326; --surface2:#143034; --ink:#E5F2F0; --muted:#8CADAA; --line:#1D3F43;
  --primary:#3DBEB7; --primary-ink:#052A2B; --primary-soft:#113539;
  --hero1:#0A3C3F; --hero2:#115F5F; --hero-ink:#F3FBFA;
  --gold:#F0B843; --gold-soft:#3A2D0F; --gold-ink:#F6D88C;
  --good:#3DC48F; --good-soft:#0F3A2B; --bad:#F0756D; --bad-soft:#40201D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(92px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.i{display:block;flex:none}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}
body.notr .tr{display:none}

.shell{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.main{min-width:0;display:grid;gap:16px;align-content:start}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;justify-content:space-around;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:0;background:none;
  color:var(--muted);font:600 11px var(--f-body);border-radius:12px}
.nav .ni{display:grid;place-items:center;width:44px;height:28px;border-radius:14px;transition:background .2s}
.nav button.on{color:var(--primary)}
.nav button.on .ni{background:var(--primary-soft)}
@media (min-width:900px){
  body{padding-bottom:40px;padding-top:20px}
  .shell{grid-template-columns:200px minmax(0,1fr);gap:28px}
  .nav{position:sticky;top:20px;align-self:start;flex-direction:column;justify-content:flex-start;gap:6px;padding:10px;border:1px solid var(--line);border-radius:20px}
  .nav button{flex:none;flex-direction:row;gap:12px;padding:6px 10px 6px 6px;font-size:15px;justify-content:flex-start}
  .nav .ni{width:40px;height:36px}
}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:700 26px/1 var(--f-kufi);padding-bottom:4px}
.bname{font:700 22px var(--f-disp);letter-spacing:-.02em}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:600 14px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.chip.gold .i{color:var(--gold)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card h2,.sec h2{font:700 19px var(--f-disp);letter-spacing:-.01em}
.sec{display:grid;gap:12px}
.sec>h2{padding:0 2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.eyebrow-sm{font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;background:linear-gradient(140deg,var(--hero1),var(--hero2));color:var(--hero-ink);--ring-bg:rgba(255,255,255,.2);--ring-fg:var(--gold-btn)}
.hero>svg.geo{position:absolute;inset:0;width:100%;height:100%;opacity:.14;pointer-events:none}
.hero>*:not(.geo){position:relative}
.hero-row{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero-copy{display:grid;gap:8px;justify-items:start;min-width:0;flex:1 1 240px}
.hello{font:700 clamp(34px,8vw,52px)/1.4 var(--f-ar);direction:rtl}
.hero .sub{opacity:.9}
.hero-ring{display:grid;justify-items:center;gap:2px}
.hero-ring .rl{font:600 13px var(--f-body);opacity:.85}
.ringt{font:700 26px var(--f-disp);fill:currentColor}
.hero h1.title{font:700 clamp(26px,6vw,38px)/1.15 var(--f-disp);letter-spacing:-.02em}
.hero .kufi{font:700 clamp(30px,7vw,46px)/1.5 var(--f-kufi);direction:rtl}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:14px;border:1.5px solid transparent;font:700 16px var(--f-body);text-decoration:none}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.gold{background:var(--gold-btn);color:var(--gold-btn-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}

.stat{display:grid;gap:2px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat b{font:700 24px var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.stat .i{color:var(--gold)}

.wotd{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.wotd .big{font-size:48px;line-height:1.6}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .35s}
.bar.gold i{background:var(--gold)}

/* learn */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--primary);font:700 15px var(--f-body);padding:6px 0;justify-self:start}
.pathcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.pathcard .pg{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font:700 30px/1 var(--f-kufi);padding-bottom:6px;flex:none}
.pathcard .pt{display:grid;gap:4px;min-width:0;flex:1}
.pathcard b{font:700 17px var(--f-disp)}
.pathcard .bar{height:7px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.ltile{position:relative;display:grid;justify-items:center;gap:0;padding:8px 4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.ltile .ar{font-size:38px;line-height:1.5}
.ltile small{font-size:12px;color:var(--muted);white-space:nowrap}
.ltile.in::after{content:"";position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%;background:var(--good)}
.wrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.wrow .wm{flex:1;min-width:0;display:grid;gap:2px}
.wrow .wm b{font-weight:600}
.wrow .wa{font-size:30px;line-height:1.6;text-align:right;max-width:46%}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:4px;border-radius:3px;background:var(--surface2)}
.dots i.on{background:var(--primary)}
.sw{display:block;width:34px;height:34px;border-radius:10px;border:1px solid var(--line)}
.dg{font-size:26px;line-height:1.3;color:var(--primary);min-width:34px;text-align:center}
.rule{display:grid;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.rule b{font:700 16px var(--f-disp)}
.vrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vrow .ar{font-size:40px;line-height:1.5;text-align:center}
.vrow .vx{font-size:30px;text-align:right}

/* practice */
.ptile{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.ptile .pi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.ptile.hot{background:var(--primary);border-color:transparent;color:var(--primary-ink)}
.ptile.hot .pi{background:rgba(255,255,255,.18);color:var(--primary-ink)}
.ptile .pt{display:grid;gap:2px;flex:1;min-width:0}
.ptile b{font:700 17px var(--f-disp)}
.ptile span.d{font-size:14px;opacity:.8}
.scopes{display:flex;gap:8px;flex-wrap:wrap}
.scope{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:600 14px var(--f-body)}
.scope.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}

/* profile */
.field{display:grid;gap:6px}
.field label,.lab{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=text],textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:16px var(--f-body)}
textarea{min-height:92px;resize:vertical}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);gap:4px}
.seg button{flex:1;padding:9px 10px;border:0;border-radius:10px;background:none;font:600 14px var(--f-body);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.toggle:first-of-type{border-top:0}
.sw-t{width:46px;height:28px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked=true] .sw-t{background:var(--primary)}
.toggle[aria-checked=true] .sw-t::after{transform:translateX(18px)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.badge .bm{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:700 30px/1 var(--f-kufi);padding-bottom:6px;background:var(--gold-soft);color:var(--gold-ink);border:2px solid var(--gold)}
.badge.lock{opacity:.5}
.badge.lock .bm{background:var(--surface2);color:var(--muted);border-color:var(--line);filter:grayscale(1)}
.badge b{font-size:14px}
.badge small{font-size:12px;color:var(--muted);line-height:1.3}

/* contest */
.cd{display:flex;gap:10px;margin-top:6px}
.cd div{display:grid;justify-items:center;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.14);min-width:72px}
.cd b{font:700 30px var(--f-disp);font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:12px;opacity:.85}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{display:grid;gap:4px;justify-items:center;text-align:center;padding:14px 8px;border-radius:16px 16px 0 0;background:var(--primary-soft);color:var(--primary)}
.pod b{font:700 24px var(--f-disp);color:var(--ink)}
.pod small{font-size:12px;color:var(--muted);line-height:1.3}
.pod .pl{font:700 13px var(--f-body);letter-spacing:.06em}
.pod.p1{min-height:176px;background:var(--gold-soft);color:var(--gold-ink)}
.pod.p2{min-height:148px}
.pod.p3{min-height:128px}
.tl{display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:18px;position:relative}
.tl li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--primary);background:var(--surface);margin-top:2px}
.tl li.now .dot{background:var(--primary)}
.tl li.gold .dot{border-color:var(--gold)}
.tl b{display:block}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none}
.check:first-of-type{border-top:0}
.check .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;margin-top:1px}
.check[aria-checked=true] .bx{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-checked=true] span.t{color:var(--muted)}
.goal{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.goal .n{width:34px;height:34px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font:700 16px var(--f-disp)}
.draft{white-space:pre-wrap;padding:14px;border-radius:14px;background:var(--surface2);font-size:15px;line-height:1.55;min-height:80px}
.gck{display:flex;gap:8px;align-items:center;font-size:15px}
.gck input{width:20px;height:20px;accent-color:var(--primary)}

/* session overlay */
#session{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#session:empty{display:none}
.s-wrap{max-width:640px;margin:0 auto;display:grid;gap:16px;align-content:start;min-height:100%}
.s-head{display:flex;align-items:center;gap:12px;padding-top:12px}
.s-title{font:600 13px var(--f-body);color:var(--muted);white-space:nowrap}
.s-body{display:grid;gap:16px;align-content:start}
.s-body.center{text-align:center;justify-items:center}
.fcard,.qbox{display:grid;justify-items:center;gap:8px;padding:26px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.fcard .big,.qglyph{font-size:68px;line-height:1.5}
.fcard .big.sm{font-size:48px}
.fcard .ans{display:grid;gap:2px;justify-items:center;padding-top:12px;border-top:1px dashed var(--line);width:100%}
.fcard .ans b{font:700 22px var(--f-disp)}
.qprompt{font:700 28px var(--f-disp)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.choice{display:flex;align-items:center;justify-content:center;min-height:62px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font:600 17px var(--f-body);text-align:center}
.choice.ar{font-size:30px;line-height:1.5}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.dim{opacity:.55}
.choice:disabled{cursor:default}
.feed{display:grid;gap:12px;padding:14px;border-radius:16px;font-weight:600}
.feed.good{background:var(--good-soft);color:var(--good)}
.feed.bad{background:var(--bad-soft);color:var(--bad)}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grades .btn{flex-direction:column;gap:0;min-height:58px;padding:8px}
.grades .btn small{font:500 12px var(--f-body);opacity:.8}
.g-again{background:var(--bad-soft);color:var(--bad)}
.g-good{background:var(--primary-soft);color:var(--primary)}
.g-easy{background:var(--good-soft);color:var(--good)}
.digit{font-size:56px;line-height:1.3;color:var(--primary)}
.sw.lg{width:72px;height:72px;border-radius:20px}
.tbox{position:relative;border-radius:22px;border:1.5px dashed var(--line);background:var(--surface);overflow:hidden;height:300px}
.tbox canvas{position:absolute;left:0;top:0}
.tbox .tgv{opacity:.22}
.tbox .tcv{touch-action:none;cursor:crosshair}
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.picker button{flex:none;width:48px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:28px/1.5 var(--f-ar)}
.picker button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.tres{text-align:center;font-weight:600;min-height:26px}

'Your initiative is a tech or computing tool, such as an app, platform, interactive game, AI tool or website, that serves Arabic or helps non-native speakers learn it.|Inisiatif anda ialah alat teknologi atau pengkomputeran, seperti aplikasi, platform, permainan interaktif, alat AI atau laman web, yang berkhidmat kepada bahasa Arab atau membantu penutur bukan Arab mempelajarinya.|مبادرتك أداة تقنية أو محوسبة (تطبيق أو منصة أو لعبة تفاعلية أو أداة ذكاء اصطناعي أو موقع) تخدم اللغة العربية أو تعلّمها للناطقين بغيرها.','It is finished, or at a first prototype that people can test and run.|Ia siap, atau pada prototaip pertama yang boleh diuji dan dijalankan.|مكتملة أو في مرحلة نموذج أول قابل للاختبار والتشغيل الفعليين.','It is your own original work and does not use anyone else’s intellectual property.|Ia hasil kerja asli anda dan tidak menggunakan hak harta intelek orang lain.|عملك الأصيل ولا تتعدى على الحقوق الفكرية للآخرين.','You recorded an explainer video of no more than 3 minutes.|Anda merakam video penjelasan tidak melebihi 3 minit.|سجّلت فيديو توضيحيًا لا يتجاوز 3 دقائق.','You wrote a short explanation of the idea, how it works and what it aims to do.|Anda menulis penjelasan ringkas tentang idea, cara ia berfungsi dan objektifnya.|كتبت شرحًا مختصرًا للفكرة وآلية عملها وأهدافها.','You will send everything before Saturday 5 December 2026.|Anda akan menghantar semuanya sebelum Sabtu 5 Disember 2026.|سترسل كل شيء قبل السبت 5 ديسمبر 2026.',
'What the competition aims for|Matlamat pertandingan|أهداف المسابقة','Encourage creative minds and tech enthusiasts to build practical, service-oriented digital solutions for Arabic.|Menggalakkan minda kreatif dan peminat teknologi membina penyelesaian digital yang praktikal dan berorientasikan perkhidmatan untuk bahasa Arab.|تحفيز العقول المبدعة والمهتمين بالتقنية على تقديم حلول ومبادرات حوسبية خدمية وتطبيقية للغة العربية.','Showcase tools, platforms and apps that make Arabic easier to learn for non-native speakers and strengthen their skills.|Mempamerkan alat, platform dan aplikasi yang memudahkan penutur bukan Arab belajar bahasa Arab dan mengukuhkan kemahiran mereka.|إبراز الأدوات والمنصات والتطبيقات التي تسهّل تعليم العربية للناطقين بغيرها وتعزز مهاراتهم اللغوية.','Make the global day relevant through real links to the digital and AI age.|Menjadikan hari sedunia ini relevan melalui hubungan sebenar dengan era digital dan AI.|تفعيل المناسبة العالمية بصورة عملية ترتبط بمتطلبات العصر الرقمي والذكاء الاصطناعي.','Attract the best ideas and software so they can be invested in or featured for teaching and academic use.|Menarik idea dan perisian terbaik supaya ia boleh dilaburkan atau diketengahkan untuk pengajaran dan kegunaan akademik.|استقطاب أفضل الأفكار والحلول المحوسبة لاستثمارها أو تسليط الضوء عليها لخدمة المسار التعليمي والأكاديمي.','Strengthen cooperation between programmers and specialists in teaching Arabic.|Mengukuhkan kerjasama antara pengaturcara dan pakar pengajaran bahasa Arab.|تعزيز التعاون بين المبرمجين والمتخصصين في تعليم العربية.',
'How Abjad Arabic answers the brief|Bagaimana Abjad Arabic menjawab ringkasan|كيف يلبّي أبجد عربي المطلوب','Practical learning tools in one place: spaced review, quizzes, tracing and a word builder.|Alat pembelajaran praktikal di satu tempat: ulang kaji berjarak, kuiz, jejak huruf dan pembina perkataan.|أدوات تعلّم عملية في مكان واحد: مراجعة متباعدة واختبارات وتتبّع وبنّاء كلمات.','Transliteration, audio, joined letter forms and vowel marks lower the barrier for non-native speakers.|Transliterasi, audio, bentuk huruf bersambung dan tanda vokal merendahkan halangan untuk penutur bukan Arab.|النطق اللاتيني والصوت وأشكال الحروف المتصلة والحركات تسهّل الطريق على الناطقين بغير العربية.','Review scheduling adapts to what you forget, ready for AI add-ons such as speech feedback.|Penjadualan ulang kaji menyesuaikan diri dengan apa yang anda lupa, sedia untuk tambahan AI seperti maklum balas pertuturan.|تتكيّف جدولة المراجعة مع ما تنساه، وهي جاهزة لإضافات الذكاء الاصطناعي.','A complete, working prototype that can be shown to teachers and students today.|Prototaip lengkap yang berfungsi dan boleh ditunjukkan kepada guru dan pelajar hari ini.|نموذج أول مكتمل يعمل ويمكن عرضه على المعلمين والطلاب اليوم.','Content lives in simple units, so teachers and developers can extend the course.|Kandungan berada dalam unit mudah, jadi guru dan pembangun boleh mengembangkan kursus.|المحتوى في وحدات بسيطة ليتمكن المعلمون والمطورون من توسيع المقرر.',

/* grammar */
'The article “al-”|Kata sandang “al-”|','Add ال to the front of a noun to say “the”. Before 14 sun letters the L is not pronounced and the next letter doubles.|Tambah ال di hadapan kata nama untuk bermaksud “the”. Sebelum 14 huruf syamsiah, bunyi L tidak disebut dan huruf seterusnya digandakan.|','Moon letters keep the L sound: الْقَمَر (al-qamar), the moon.|Huruf qamariah mengekalkan bunyi L: الْقَمَر (al-qamar), bulan.|','Sun letters swallow the L: الشَّمْس (ash-shams), the sun.|Huruf syamsiah menelan bunyi L: الشَّمْس (ash-shams), matahari.|','Sun letters: ت ث د ذ ر ز س ش ص ض ط ظ ل ن|Huruf syamsiah: ت ث د ذ ر ز س ش ص ض ط ظ ل ن|','Moon letters: ا ب ج ح خ ع غ ف ق ك م ه و ي|Huruf qamariah: ا ب ج ح خ ع غ ف ق ك م ه و ي|',
'Masculine and feminine|Maskulin dan feminin|','Every noun is masculine or feminine. Most feminine words end in ة (taa’ marbūṭa), and adjectives must match.|Setiap kata nama ialah maskulin atau feminin. Kebanyakan perkataan feminin berakhir dengan ة (taa’ marbūṭa), dan kata sifat mesti sepadan.|','Add ة to many masculine words to make the feminine.|Tambah ة pada banyak perkataan maskulin untuk menjadikannya feminin.|','Adjectives follow the noun and agree with it: كِتَاب كَبِير, سَيَّارَة كَبِيرَة.|Kata sifat mengikut kata nama dan sepadan dengannya: كِتَاب كَبِير, سَيَّارَة كَبِيرَة.|','Words for female people almost always end in ة.|Perkataan untuk orang perempuan hampir selalu berakhir dengan ة.|',
'Pronouns|Kata ganti nama|','Arabic separates “you” into masculine and feminine, and has special forms for groups.|Bahasa Arab membezakan “you” kepada maskulin dan feminin, dan mempunyai bentuk khas untuk kumpulan.|','There is no word for “am, is, are” in the present, so أَنَا طَالِب means “I am a student”.|Tiada perkataan untuk “am, is, are” pada kala kini, jadi أَنَا طَالِب bermaksud “Saya seorang pelajar”.|','Learn these as a set: they appear in every conversation.|Pelajari kesemuanya sebagai satu set: ia muncul dalam setiap perbualan.|',
'Simple sentences|Ayat mudah|','In the present tense a sentence can be just two words side by side. No verb is needed.|Pada kala kini, ayat boleh hanya dua perkataan bersebelahan. Tiada kata kerja diperlukan.|','Subject first, then the description: أَنَا طَالِب.|Subjek dahulu, kemudian penerangan: أَنَا طَالِب.|','هَذَا means “this” for masculine things and هَذِهِ for feminine ones.|هَذَا bermaksud “ini” untuk benda maskulin dan هَذِهِ untuk benda feminin.|','Add the article to the subject and drop it from the description: الْبَيْت كَبِير.|Letakkan kata sandang pada subjek dan buang daripada penerangan: الْبَيْت كَبِير.|',
'Plurals|Bentuk jamak|','Arabic has three plural families. Two follow rules, and one changes the shape of the word.|Bahasa Arab mempunyai tiga keluarga jamak. Dua mengikut peraturan, dan satu mengubah bentuk perkataan.|','Sound masculine plural: add ـُونَ, as in مُعَلِّمُونَ.|Jamak maskulin salim: tambah ـُونَ, seperti dalam مُعَلِّمُونَ.|','Sound feminine plural: replace ة with ـَات, as in طَالِبَات.|Jamak feminin salim: gantikan ة dengan ـَات, seperti dalam طَالِبَات.|','Broken plurals change inside the word: كِتَاب becomes كُتُب. Learn each one as a new word.|Jamak taksir berubah di dalam perkataan: كِتَاب menjadi كُتُب. Pelajari setiap satu sebagai perkataan baharu.|',
'Past tense verbs|Kata kerja kala lampau|','A verb is a root plus a pattern. The simplest form is “he did it”, and endings show who did it.|Kata kerja ialah akar ditambah corak. Bentuk paling mudah ialah “dia melakukannya”, dan pengakhiran menunjukkan siapa pelakunya.|','Start from the “he” form: كَتَبَ.|Mulakan dengan bentuk “dia”: كَتَبَ.|','Endings change the doer: تْ for she, تُ for I, نَا for we, وا for they.|Pengakhiran mengubah pelaku: تْ untuk dia (perempuan), تُ untuk saya, نَا untuk kami, وا untuk mereka.|',
'Prepositions|Kata sendi|','Small words that link things in place and meaning. They are short, common and worth memorising early.|Perkataan kecil yang menghubungkan tempat dan makna. Ia pendek, lazim dan berbaloi dihafal awal.|','After most prepositions the noun takes a lower vowel ending, but you can ignore this at first.|Selepas kebanyakan kata sendi, kata nama mengambil pengakhiran vokal bawah, tetapi anda boleh mengabaikannya pada mulanya.|','Combine with pronoun endings later: مَعِي means “with me”.|Gabungkan dengan akhiran kata ganti kemudian: مَعِي bermaksud “bersama saya”.|',
'Question words|Kata tanya|','Put a question word first and the rest of the sentence follows.|Letakkan kata tanya dahulu dan baki ayat mengikut.|','Add هَلْ at the start for a yes or no question: هَلْ أَنْتَ طَالِب؟|Tambah هَلْ di awal untuk soalan ya atau tidak: هَلْ أَنْتَ طَالِب؟|','Question words never change for gender.|Kata tanya tidak berubah mengikut jantina.|',
'Possession|Milikan|','Instead of a separate word for “my” or “your”, Arabic attaches a short ending to the noun.|Daripada perkataan berasingan untuk “saya punya” atau “awak punya”, bahasa Arab melekatkan akhiran pendek pada kata nama.|','The endings: ـِي my, ـكَ your (m), ـكِ your (f), ـهُ his, ـهَا her, ـنَا our.|Akhiran: ـِي saya, ـكَ awak (L), ـكِ awak (P), ـهُ dia (L), ـهَا dia (P), ـنَا kami.|','Remove the ة and use ت in front of the ending: سَيَّارَة becomes سَيَّارَتِي.|Buang ة dan guna ت di hadapan akhiran: سَيَّارَة menjadi سَيَّارَتِي.|',

const viz=(v,lg)=>!v?'':v[0]==='#'?`<span class="sw${lg?' lg':''}" style="background:${v}"></span>`:/[\u0660-\u0669]/.test(v)?`<span class="dg ar${lg?' digit':''}">${v}</span>`:`<span class="pic${lg?' lg':''}" aria-hidden="true">${v}</span>`;
function ring(p,size,sw,center,fs){const r=(size-sw)/2,c=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p*100)}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-bg)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-fg)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ringt" ${fs?`style="font-size:${fs}px"`:''}>${center}</text></svg>`;}
const spkBtn=(tx,soft)=>`<button class="icon-btn ${soft?'soft':''}" data-act="say" data-say="${esc(tx)}" aria-label="Hear it">${svg(ic.spk)}</button>`;
function weekChart(){const tn=today(),W=340,H=150,bw=30,top=24,bh=96,cw=282,gap=(cw-7*bw)/6;const vals=[],ds=[];for(let k=6;k>=0;k--){ds.push(tn-k);vals.push(S.days[tn-k]||0);}const max=Math.max(S.goal,...vals,10);const wd=['S','M','T','W','T','F','S'];const gy=top+bh-bh*S.goal/max;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t('XP earned over the last 7 days'))}" style="display:block;max-width:460px"><g direction="ltr">`;
 s+=`<line x1="0" x2="${cw+6}" y1="${gy}" y2="${gy}" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W}" y="${gy+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-body)">${t('goal {n}',{n:S.goal})}</text>`;
 ds.forEach((d,k)=>{const h=Math.max(vals[k]?bh*vals[k]/max:3,3),x=k*(bw+gap),y=top+bh-h,isT=d===tn;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${vals[k]?'var(--primary)':'var(--surface2)'}" ${isT?'':'opacity=".85"'}/>`;if(vals[k])s+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">${vals[k]}</text>`;s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isT?'var(--primary)':'var(--muted)'}" font-weight="${isT?700:500}" font-family="var(--f-body)">${wd[(d+4)%7]}</text>`;});
 return s+'</g></svg>';}
const mcq=(hint,q,ans,wrong,o)=>{o=o||{};const ch=shuffle([ans].concat(wrong)).map(x=>({h:o.ar?A(x):esc(x),cls:o.ar?'ar':'',ok:x===ans}));return{hint,q,ch,ans:o.ar?A(ans):esc(ans),say:o.say,id:o.id};};
function pairQs(rows,n){
 return pick(rows,n).map(r=>{const others=rows.filter(x=>x!==r);
  if(Math.random()<.55)return mcq('What does this mean?',`<div class="qglyph ar" style="font-size:44px" lang="ar">${A(r[0])}</div><div class="tr muted">${esc(r[1])}</div>${spkBtn(r[0],1)}`,r[2],pick(others.map(x=>x[2]).filter(x=>x!==r[2]),3));
  return mcq('Pick the Arabic for',`<div class="qprompt">${esc(r[2])}</div>`,r[0],pick(others.map(x=>x[0]).filter(x=>x!==r[0]),3),{ar:1});});
}

function nextUnit(){return (UNITS.find(u=>mastery(u.id)<.5)||UNITS[0]).id;}
function roadmap(){
 const start={beginner:0,elementary:2,advanced:5}[S.level]||0;
 const gdone=()=>S.done.g.filter(x=>x!=='vowels').length;
 const defs=[
 {k:'letters',t:'Meet the 28 letters',d:'Learn each letter’s name, sound and four forms.',pf:()=>cnt('l')/28,act:'openAlpha',cta:'Open the alphabet'},
 {k:'vowels',t:'Vowels and reading rules',d:'Short and long vowels, and how to read right to left.',pf:()=>S.done.g.indexOf('vowels')>=0?1:0,act:'openVowels',cta:'Learn the vowels'},
 {k:'ear',t:'Train your eye and ear',d:'Take two letter quizzes to lock in shapes and sounds.',pf:()=>S.stats.lquiz/2,act:'startQuiz',v:'letters',cta:'Start a letters quiz'},
 {k:'join',t:'Join letters into words',d:'Build five words from scrambled letters.',pf:()=>S.stats.builds/5,act:'startBuilder',v:'word',cta:'Open the word builder'},
 {k:'words',t:'Your first 50 words',d:'Study units and keep them in your review deck.',pf:()=>cnt('w')/50,act:'openUnit',v:nextUnit(),cta:'Study a unit'},
 {k:'grammar',t:'Grammar foundations',d:'Pass five short lessons from the grammar lab.',pf:()=>gdone()/5,act:'openGrammar',cta:'Open the grammar lab'},
 {k:'speak',t:'Sentences and conversations',d:'Build sentences and finish dialogues.',pf:()=>(S.stats.sents+S.stats.dlg*3)/9,act:'startBuilder',v:'sent',cta:'Build sentences'},
 {k:'roots',t:'Roots and word families',d:'Pass three root quizzes and see how words connect.',pf:()=>S.done.r.length/3,act:'openRoots',cta:'Explore roots'}];
 let ni=-1;
 defs.forEach((x,i)=>{x.i=i;x.p=Math.min(1,x.pf());x.done=x.p>=1;x.skip=i<start&&!x.done;if(ni<0&&i>=start&&!x.done)ni=i;});
 const total=defs.reduce((a,x)=>a+x.p,0)/defs.length;
 const next=ni<0?{t:'Path complete',d:'Keep your streak alive with reviews and the daily challenge.',act:'startDaily',cta:'Take the daily challenge',p:1}:defs[ni];
 return{defs,next,total};
}

function hlRoot(word,root){
 const nm=c=>/[\u0621\u0623\u0625\u0624\u0626\u0622]/.test(c)?'ء':c==='ى'?'ي':c,rs=root.split('').map(nm),cl=[];
 word.split('').forEach(c=>{if(isMark(c)&&cl.length)cl[cl.length-1]+=c;else cl.push(c);});
 let k=0;return cl.map(c=>{if(k<rs.length&&nm(c[0])===rs[k]){k++;return `<span class="rt">${c}</span>`;}return esc(c);}).join('');
}

const norm=s=>strip(s).replace(/[\u0625\u0623\u0622]/g,'ا').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[ʿʾʼ’'\-]/g,'').toLowerCase();
function dictItems(){
 const q=norm(ui.dq.trim()),sc=ui.dscope;let out=[];

}

function makeQ(c,pool){
 if(c.kind==='l'){
  const ty=pick(['ln','nl','fn'],1)[0],o=pick(LETS.filter(x=>x.id!==c.id),3),all=shuffle([c].concat(o));

  return{hint:ty==='fn'?'Which letter is hiding in this joined form?':'What is this letter called?',q:`<div class="qglyph ar">${gl}</div>`,say:c.ar,ch:all.map(x=>({h:esc(x.l.name),ok:x.id===c.id})),ans:c.l.name,id:c.id};
 }
 const o=pick(pool.filter(x=>x.id!==c.id&&x.en!==c.en),3),all=shuffle([c].concat(o));
 const hasPic=isPic(c.viz),pp=pool.filter(x=>x.id!==c.id&&x.viz!==c.viz&&x.en!==c.en),ty=pick((canSpeak?['a2e','e2a','lis']:['a2e','e2a']).concat(hasPic&&pp.length>=3?['pic','pic','pic']:[]),1)[0];

 if(ty==='a2e')return{hint:'What does this mean?',q:`${isPic(c.viz)?'':viz(c.viz,1)}<div class="qglyph ar" lang="ar">${A(c.ar)}</div><div class="tr muted">${esc(c.tr)}</div>${spkBtn(c.ar,1)}`,ch:all.map(x=>({h:esc(x.en),ok:x.id===c.id})),ans:esc(c.en),id:c.id,say:c.ar};
 if(ty==='e2a')return{hint:'Pick the Arabic for',q:`${isPic(c.viz)?viz(c.viz,1):''}<div class="qprompt">${esc(c.en)}</div>`,ch:all.map(x=>({h:A(x.ar),cls:'ar',ok:x.id===c.id})),ans:A(c.ar),id:c.id,say:c.ar};

/* --- word and sentence builder --- */
function startBuilder(kind){
 kind=kind==='sent'?'sent':'word';let rounds;
 if(kind==='word'){
  const pool=WORDS.filter(c=>{const b=strip(c.ar).replace('؟','');return /^[ء-ي]+$/.test(b)&&b.length>=3&&b.length<=6;});
  rounds=pick(pool,5).map(c=>{const tx=strip(c.ar),ls=tx.split('').map((ch,k)=>({id:k,ch}));let tiles=shuffle(ls),tr=0;while(tiles.map(x=>x.ch).join('')===tx&&tr++<6)tiles=shuffle(ls);return{t:tx,tiles,en:c.en,tr:c.tr,full:c.ar};});
 }else rounds=pick(SENTS,5).map(x=>{const ls=x[0].map((ch,k)=>({id:k,ch}));let tiles=shuffle(ls),tr=0;while(tiles.map(y=>y.ch).join(' ')===x[0].join(' ')&&tr++<6)tiles=shuffle(ls);return{t:x[0].join(' '),tiles,en:x[2],tr:x[1],full:x[0].join(' ')};});
 openSession({type:'builder',kind,rounds,i:0,placed:[],status:null,hint:false,score:0});
}

 const n=s.rounds.length,r=s.rounds[s.i],sent=s.kind==='sent',ttl=sent?'Sentence builder':'Word builder';

 const str=s.placed.map(id=>r.tiles.find(x=>x.id===id).ch).join(sent?' ':'');
 return `${sHead(ttl,s.i/n)}<div class="s-body"><p class="eyebrow-sm">${sent?'Build the Arabic sentence for':'Build the Arabic word for'}</p><h2 style="font:700 28px var(--f-disp);text-align:center">${esc(r.en)}</h2>
 ${s.hint?`<p class="tr muted" style="text-align:center">${esc(r.tr)}</p>`:''}
 <div class="bd-ans ar ${sent?'sent':''} ${s.status||''}" lang="ar">${s.status==='ok'?A(r.full):(sent?A(str):str)||`<span class="ph">${sent?t('Tap the words in order, starting from the right'):t('Tap the letters, starting from the right')}</span>`}</div>

 let pool=own.slice();QUEST.forEach(o=>{if(o.id!==id)bossCards(o.id).forEach(c=>{if(pool.indexOf(c)<0)pool.push(c);});});
 (typeof WORDS!=='undefined'?WORDS:[]).forEach(c=>{if(pool.length<14&&pool.indexOf(c)<0)pool.push(c);});

 while(qs.length<hp+4){if(!bag.length)bag=shuffle(own.concat(own,pool.slice(0,8)));qs.push(goodQ(bag.pop(),pool));}

 <p class="eyebrow-sm">${t(q.hint)}${s.combo>=2?` · 🔥 ${s.combo}`:''}</p><div class="qbox">${q.q}</div>${q.say&&q.q.indexOf('data-act="say"')<0?`<button class="icon-btn soft" data-act="say" data-say="${esc(q.say)}" aria-label="${esc(t('Hear it'))}">${svg(ic.spk,18)}</button>`:''}

 ${a?`<div class="chfb ${q.ch[s.picked].ok?'ok':'no'}" role="status">${q.ch[s.picked].ok?t('Hit! −1 boss health'):t('Ouch! You lose a heart.')}</div>`:''}</div>`;
}

const lev=(a,b)=>{const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];};
const normAr=x=>strip(x).replace(/[\u064B\u064C\u064D\u064E\u064F\u0650\u0651\u0652\u0640\s]/g,'').replace(/[\u0623\u0625\u0622]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function simScore(a,b){a=normAr(a);b=normAr(b);const L=Math.max(a.length,b.length);return L?Math.max(0,Math.round((1-lev(a,b)/L)*100)):0;}
function recCheck(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,msg=$('#recmsg');if(!msg)return;
 if(!SR){msg.textContent=t('Speech checking needs Chrome or Edge, with the microphone allowed.');return;}
 try{const r=new SR();r.lang='ar-SA';r.interimResults=false;r.maxAlternatives=3;msg.textContent=t('Listening… say the word now.');
  r.onresult=e=>{const alts=Array.from(e.results[0]).map(x=>x.transcript),best=Math.max.apply(null,alts.map(x=>simScore(x,REC.target||'')));const ok=best>=70;msg.innerHTML=`${t('I heard')}: <span class="ar" lang="ar">${esc(alts[0])}</span> · ${t('Match')}: <b>${best}%</b> ${ok?'✓ '+t('Great!'):'— '+t('Listen to the model and try again.')}`;if(ok)beep(true);S.stats.says=(S.stats.says||0)+1;save();};
  r.onerror=()=>{msg.textContent=t('The microphone is not available here. Open the installed app or the website version and allow the microphone.');};
  r.onnomatch=()=>{msg.textContent=t('I could not hear that. Try again.');};
  r.start();}catch(e){msg.textContent=t('Speech checking needs Chrome or Edge, with the microphone allowed.');}
}

function bestVoice(vs){
 const a=(vs||[]).filter(x=>/^ar/i.test(x.lang));if(!a.length)return null;
 if(S.voice){const f=a.find(x=>x.name===S.voice);if(f)return f;}
 const sc=v=>(/natural|neural|enhanced|premium|online/i.test(v.name)?4:0)+(/google|microsoft|apple|siri/i.test(v.name)?2:0)+(/ar-SA/i.test(v.lang)?1:0)+(v.localService?0:1);
 return a.slice().sort((x,y)=>sc(y)-sc(x))[0];
}

const TFORMS=[['iso','Alone'],['ini','Start'],['med','Middle'],['fin','End']];
function startTrace(i){ui.sheet=null;renderSheet();openSession({type:'trace',li:+i,form:'iso'});}
function trView(s){
 const l=L[s.li];
 return `${sHead('Trace letters',0)}<div class="s-body"><div class="seg" role="group" aria-label="Letter form">${TFORMS.map(f=>`<button class="${s.form===f[0]?'on':''}" data-act="tForm" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>
 <div class="tbox"><canvas id="tgv" class="tgv"></canvas><canvas id="tcv" class="tcv" aria-label="Drawing area"></canvas></div>
 <div class="tres" id="tres">${esc(l.name)} · ${t('trace over the pale guide with your finger or mouse.')}</div>
 <div class="row" style="justify-content:center"><button class="btn ghost" data-act="tClear">Clear</button><button class="btn primary" data-act="tCheck">Check my tracing</button>${spkBtn(l.ch,1)}</div>
 <div class="picker" role="group" aria-label="Choose a letter">${L.map(x=>`<button class="${x.i===s.li?'on':''}" data-act="tLetter" data-v="${x.i}" aria-label="${esc(x.name)}">${x.ch}</button>`).join('')}</div></div>`;
}
const TH=300;let TW=340,TD=1;
function glyphDraw(x,text,dil){x.textAlign='center';x.textBaseline='alphabetic';x.font='230px Amiri, "Noto Naskh Arabic", serif';const m=x.measureText(text);const y=TH/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;if(dil){x.lineWidth=46;x.lineJoin='round';x.strokeText(text,TW/2,y);}x.fillText(text,TW/2,y);}
function initTrace(){
 const cv=$('#tcv'),gv=$('#tgv');if(!cv)return;
 const wrap=cv.parentElement;TW=Math.max(260,wrap.clientWidth||340);TD=Math.min(window.devicePixelRatio||1,2.5);
 [cv,gv].forEach(c=>{c.width=Math.round(TW*TD);c.height=Math.round(TH*TD);c.style.width=TW+'px';c.style.height=TH+'px';});
 const draw=()=>{const g=gv.getContext('2d');g.setTransform(TD,0,0,TD,0,0);g.clearRect(0,0,TW,TH);g.fillStyle=getComputedStyle(document.body).color;glyphDraw(g,L[ui.session.li].f[ui.session.form],false);};
 draw();if(document.fonts&&document.fonts.load)document.fonts.load('230px Amiri','ب').then(()=>{if($('#tgv')===gv)draw();}).catch(()=>{});
 const x=cv.getContext('2d');x.setTransform(TD,0,0,TD,0,0);x.lineWidth=18;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--primary').trim()||'#13807D';
 let down=false;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*(TW/r.width),(e.clientY-r.top)*(TH/r.height)];};
 cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.01,p[1]);x.stroke();e.preventDefault();});
 cv.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();x.beginPath();x.moveTo(p[0],p[1]);});
 const up=()=>{down=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}
function checkTrace(){
 const s=ui.session,cv=$('#tcv');if(!cv)return;
 const W=cv.width,H=cv.height,u=cv.getContext('2d').getImageData(0,0,W,H).data,text=L[s.li].f[s.form];
 const mk=dil=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.setTransform(TD,0,0,TD,0,0);x.fillStyle='#000';x.strokeStyle='#000';glyphDraw(x,text,dil);return x.getImageData(0,0,W,H).data;};
 const gl=mk(false),dl=mk(true);let gt=0,gc=0,ut=0,us=0;
 for(let i=3;i<u.length;i+=4){const a=gl[i]>60,b=dl[i]>60,c=u[i]>60;if(a){gt++;if(c)gc++;}if(c){ut++;if(!b)us++;}}
 if(ut<150||!gt){$('#tres').textContent=t('Trace the letter first, then check.');return;}
 const sc=Math.max(0,Math.min(100,Math.round(100*(.7*gc/gt+.3*(1-us/ut)))));
 const msg=t(sc>=80?'Beautiful':sc>=60?'Good work':'Keep following the guide');
 let xp='';if(sc>=60){addXP(5);xp=' · +5 XP';beep(true);}else beep(false);
 if(sc>=80){S.stats.trace80++;save();}
 $('#tres').innerHTML=`${msg}: ${t('{n}% match',{n:sc})}${xp}`;
}

/* ============ tiers, exams, certificates ============ */

const strongW=()=>Object.keys(S.deck).filter(id=>id[0]==='w'&&S.deck[id].b>=3).length;
const fr=(a,b)=>()=>Math.min(a(),b)+'/'+b;
const TIERS=[
{id:'beginner',t:'Beginner',sub:'Reading and sounds',n:30,pass:.8,glyph:'أ',c:'B',reqs:[

 ['Finish two letters quizzes',()=>S.stats.lquiz/2,fr(()=>S.stats.lquiz,2)],

{id:'intermediate',t:'Intermediate',sub:'Words and simple sentences',n:40,pass:.8,glyph:'ب',c:'I',reqs:[

{id:'expert',t:'Expert',sub:'Grammar and word families',n:50,pass:.8,glyph:'ت',c:'E',reqs:[

function tierInfo(i){const T=TIERS[i],ps=T.reqs.map(r=>Math.min(1,r[1]())),p=ps.reduce((a,b)=>a+b,0)/ps.length,tasks=ps.every(x=>x>=1),prev=i===0||!!S.certs[TIERS[i-1].id];return{T,ps,p,tasks,prev,cert:S.certs[T.id],ready:tasks&&prev};}
const nCerts=()=>TIERS.filter(T=>S.certs[T.id]).length;
function certId(T){return 'ABJ-'+T.c+'-'+Date.now().toString(36).slice(-3).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();}

/* exam question banks */
function examQs(id){
 const u=a=>a.filter(Boolean);
 if(id==='beginner'){
  const basic=WORDS.filter(c=>['greet','num','family','food','color'].indexOf(c.unit)>=0);
  const rd=['ba','bu','bi','b','bb','ban'];
  const vq=pick(VOW,4).map(v=>mcq('How do you read this?',`<div class="qglyph ar">${v[3]}</div>`,v[4],pick(rd.filter(x=>x!==v[4]),3),{say:v[3]}));
  return pick(LETS,10).map(c=>makeQ(c,WORDS)).concat(pick(basic,16).map(c=>makeQ(c,WORDS)),vq);
 }
 if(id==='intermediate'){
  const g=[];GR.filter(x=>!x.q).forEach(x=>pairQs(x.rows,2).forEach(q=>g.push(q)));g.push(GR[1].q()[0]);
  const sq=pick(SENTS,5).map(s=>mcq('Which sentence means',`<div class="qprompt">${esc(s[2])}</div>`,s[0].join(' '),pick(SENTS.filter(x=>x!==s).map(x=>x[0].join(' ')),3),{ar:1}));
  const pairs=[];DL.forEach(d=>d.lines.forEach((l,i)=>{if(l.w==='A'&&d.lines[i+1]&&d.lines[i+1].w==='B')pairs.push([l,d.lines[i+1]]);}));
  const allB=[];DL.forEach(d=>d.lines.forEach(l=>{if(l.w==='B')allB.push(l.ar);}));
  const dq=pick(pairs,5).map(p=>mcq('Choose the best reply',`<div class="qglyph ar" style="font-size:40px" lang="ar">${A(p[0].ar)}</div><div class="tr muted">${esc(p[0].tr)}</div>`,p[1].ar,pick(allB.filter(x=>x!==p[1].ar),3),{ar:1}));
  return pick(WORDS,15).map(c=>makeQ(c,WORDS)).concat(g,sq,dq);
 }
 const rq=[];pick(ROOTS,5).forEach(r=>{const other=[].concat(...ROOTS.filter(x=>x!==r).map(x=>x.w)),rt=`<div class="rootbig" style="font-size:44px">${r.r.split('').join(' ')}</div>`;
  rq.push(mcq('Which word comes from the root',rt,pick(r.w,1)[0][0],pick(other,3).map(x=>x[0]),{ar:1}));
  rq.push(mcq('What idea sits behind this root?',rt,r.m,pick(ROOTS.filter(x=>x!==r).map(x=>x.m),3)));});
 const rows=[].concat(GR[5].rows,GR[8].rows,GR[4].rows);
 const gq=GR[0].q().concat(GR[1].q(),pairQs(rows,5));
 const ws=pick(WORDS,15).map((c,i)=>{const o=pick(WORDS.filter(x=>x.id!==c.id&&x.en!==c.en),3);
  return i<8?mcq('What does this mean?',`<div class="qglyph ar" lang="ar">${strip(c.ar)}</div>${spkBtn(c.ar,1)}`,c.en,o.map(x=>x.en),{id:c.id}):mcq('Pick the Arabic for',`<div class="qprompt">${esc(c.en)}</div>`,strip(c.ar),o.map(x=>strip(x.ar)),{ar:1,id:c.id});});
 const ss=pick(SENTS,10).map(s=>mcq('What does this mean?',`<div class="qglyph ar" style="font-size:34px" lang="ar">${strip(s[0].join(' '))}</div>`,s[2],pick(SENTS.filter(x=>x!==s).map(x=>x[2]),3)));
 return rq.concat(gq,ws,ss);
}
function startExam(id){const i=TIERS.findIndex(x=>x.id===id),f=tierInfo(i);
 if(!f.ready){toast('Finish every task of this level, and the level before it, to unlock the exam.');return;}
 startQs(shuffle(examQs(id)),f.T.t+' exam',{exam:id,redo:()=>startExam(id)});}

 :`<p class="muted">${t('Not passed yet. You need {p}% to pass. Review and try again.',{p:Math.round(T.pass*100)})}</p>`;}
