            ['Study on 14 different days', () => studyDays() / 14, fr(studyDays, 14)]]
        }];
      function tierInfo(i) { const T = TIERS[i], ps = T.reqs.map(r => Math.min(1, r[1]())), p = ps.reduce((a, b) => a + b, 0) / ps.length, tasks = ps.every(x => x >= 1), prev = i === 0 || !!S.certs[TIERS[i - 1].id]; return { T, ps, p, tasks, prev, cert: S.certs[T.id], ready: tasks && prev }; }
      const nCerts = () => TIERS.filter(T => S.certs[T.id]).length;
      function certId(T) { return 'ABJ-' + T.c + '-' + Date.now().toString(36).slice(-3).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(); }

      /* exam question banks */
      function examQs(id) {
        const u = a => a.filter(Boolean);
        if (id === 'beginner') {
          const basic = WORDS.filter(c => ['greet', 'num', 'family', 'food', 'color'].indexOf(c.unit) >= 0);
          const rd = ['ba', 'bu', 'bi', 'b', 'bb', 'ban'];
          const vq = pick(VOW, 4).map(v => mcq('How do you read this?', `<div class="qglyph ar">${v[3]}</div>`, v[4], pick(rd.filter(x => x !== v[4]), 3), { say: v[3] }));
          return pick(LETS, 10).map(c => makeQ(c, WORDS)).concat(pick(basic, 16).map(c => makeQ(c, WORDS)), vq);
        }
        if (id === 'intermediate') {
          const g = []; GR.filter(x => !x.q).forEach(x => pairQs(x.rows, 2).forEach(q => g.push(q))); g.push(GR[1].q()[0]);
          const sq = pick(SENTS, 5).map(s => mcq('Which sentence means', `<div class="qprompt">${esc(s[2])}</div>`, s[0].join(' '), pick(SENTS.filter(x => x !== s).map(x => x[0].join(' ')), 3), { ar: 1 }));
          const pairs = []; DL.forEach(d => d.lines.forEach((l, i) => { if (l.w === 'A' && d.lines[i + 1] && d.lines[i + 1].w === 'B') pairs.push([l, d.lines[i + 1]]); }));
          const allB = []; DL.forEach(d => d.lines.forEach(l => { if (l.w === 'B') allB.push(l.ar); }));
          const dq = pick(pairs, 5).map(p => mcq('Choose the best reply', `<div class="qglyph ar" style="font-size:40px" lang="ar">${A(p[0].ar)}</div><div class="tr muted">${esc(p[0].tr)}</div>`, p[1].ar, pick(allB.filter(x => x !== p[1].ar), 3), { ar: 1 }));
          return pick(WORDS, 15).map(c => makeQ(c, WORDS)).concat(g, sq, dq);
        }
        const rq = []; pick(ROOTS, 5).forEach(r => {
          const other = [].concat(...ROOTS.filter(x => x !== r).map(x => x.w)), rt = `<div class="rootbig" style="font-size:44px">${r.r.split('').join(' ')}</div>`;
          rq.push(mcq('Which word comes from the root', rt, pick(r.w, 1)[0][0], pick(other, 3).map(x => x[0]), { ar: 1 }));
          rq.push(mcq('What idea sits behind this root?', rt, r.m, pick(ROOTS.filter(x => x !== r).map(x => x.m), 3)));
        });
        const rows = [].concat(GR[5].rows, GR[8].rows, GR[4].rows);
        const gq = GR[0].q().concat(GR[1].q(), pairQs(rows, 5));
        const ws = pick(WORDS, 15).map((c, i) => {
          const o = pick(WORDS.filter(x => x.id !== c.id && x.en !== c.en), 3);
          return i < 8 ? mcq('What does this mean?', `<div class="qglyph ar" lang="ar">${strip(c.ar)}</div>${spkBtn(c.ar, 1)}`, c.en, o.map(x => x.en), { id: c.id }) : mcq('Pick the Arabic for', `<div class="qprompt">${esc(c.en)}</div>`, strip(c.ar), o.map(x => strip(x.ar)), { ar: 1, id: c.id });
        });
        const ss = pick(SENTS, 10).map(s => mcq('What does this mean?', `<div class="qglyph ar" style="font-size:34px" lang="ar">${strip(s[0].join(' '))}</div>`, s[2], pick(SENTS.filter(x => x !== s).map(x => x[2]), 3)));
        return rq.concat(gq, ws, ss);
      }
      function startExam(id) {
        const i = TIERS.findIndex(x => x.id === id), f = tierInfo(i);
        if (!f.ready) { toast('Finish every task of this level, and the level before it, to unlock the exam.'); return; }
        startQs(shuffle(examQs(id)), f.T.t + ' exam', { exam: id, redo: () => startExam(id) });
      }
      function examNote(s) {
        const T = TIERS.find(x => x.id === s.exam);
        return s.passed ? `<p style="color:var(--good);font-weight:700">${t('Passed! Your certificate is ready.')}</p><button class="btn gold" data-act="viewCert" data-v="${s.exam}">${t('View certificate')}</button>`
          : `<p class="muted">${t('Not passed yet. You need {p}% to pass. Review and try again.', { p: Math.round(T.pass * 100) })}</p>`;
      }

      /* certificate image */
      async function drawCert() {
        const T = TIERS.find(x => x.id === ui.cert), c = S.certs[T.id], img = $('#certimg'); if (!c || !img) return;
        try { await Promise.all([document.fonts.load('700 60px "Bricolage Grotesque"'), document.fonts.load('700 80px Amiri'), document.fonts.load('500 30px Figtree')]); } catch (e) { }
        const W = 1600, H = 1130, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
        const ink = '#0F2A2C', mute = '#52706F', gold = '#E0A22A', deep = '#0B4548';
        x.fillStyle = deep; x.fillRect(0, 0, W, H); x.fillStyle = '#FFFFFF'; x.fillRect(40, 40, W - 80, H - 80);
        const g = x.createLinearGradient(0, 40, W, 290); g.addColorStop(0, deep); g.addColorStop(1, '#14706F'); x.fillStyle = g; x.fillRect(40, 40, W - 80, 250);
        x.save(); x.beginPath(); x.rect(40, 40, W - 80, 250); x.clip(); x.strokeStyle = 'rgba(255,255,255,.13)'; x.lineWidth = 2;
        for (let px = 40; px < W; px += 70)for (let py = 40; py < 300; py += 70) { x.beginPath(); for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8, r = k % 2 ? 11 : 27; x.lineTo(px + 35 + Math.cos(a) * r, py + 35 + Math.sin(a) * r); } x.closePath(); x.stroke(); }
        x.restore();
        x.strokeStyle = gold; x.lineWidth = 5; x.strokeRect(62, 62, W - 124, H - 124);
        x.textAlign = 'center'; x.textBaseline = 'alphabetic';
        x.fillStyle = '#FFFFFF'; x.direction = 'rtl'; x.font = '700 96px Amiri, serif'; x.fillText('شهادة إتمام', W / 2, 175); x.direction = 'ltr';
        x.font = '600 32px Figtree, sans-serif'; try { x.letterSpacing = '8px'; } catch (e) { } x.fillText('CERTIFICATE OF COMPLETION', W / 2, 245); try { x.letterSpacing = '0px'; } catch (e) { }
        x.fillStyle = mute; x.font = '500 32px Figtree, sans-serif'; x.fillText('This certifies that', W / 2, 375);
        let nm = S.name || 'Your name', fs = 104; x.fillStyle = ink; do { x.font = '700 ' + fs + 'px "Bricolage Grotesque", Figtree, sans-serif'; fs -= 4; } while (x.measureText(nm).width > W - 340 && fs > 40);
        x.fillText(nm, W / 2, 500); x.strokeStyle = gold; x.lineWidth = 3; x.beginPath(); x.moveTo(W / 2 - 460, 535); x.lineTo(W / 2 + 460, 535); x.stroke();
        x.fillStyle = mute; x.font = '500 32px Figtree, sans-serif'; x.fillText('has successfully completed the', W / 2, 610);
        x.fillStyle = deep; x.font = '700 78px "Bricolage Grotesque", Figtree, sans-serif'; x.fillText(T.t + ' Level', W / 2, 710);
        x.fillStyle = mute; x.font = '500 34px Figtree, sans-serif'; x.fillText(T.sub, W / 2, 765);
        x.fillStyle = ink; x.font = '600 34px Figtree, sans-serif'; x.fillText('Final exam score: ' + c.score + '%', W / 2, 830);
        x.fillStyle = gold; x.beginPath(); x.arc(W / 2, 920, 78, 0, Math.PI * 2); x.fill(); x.strokeStyle = '#FFFFFF'; x.lineWidth = 4; x.beginPath(); x.arc(W / 2, 920, 64, 0, Math.PI * 2); x.stroke();
        x.fillStyle = deep; x.direction = 'rtl'; x.font = '700 92px Amiri, serif'; x.fillText(T.glyph, W / 2, 950); x.direction = 'ltr';
        const dt = new Date(c.date + 'T00:00:00').toLocaleDateString(LOC[S.lang] === 'ar' ? 'en-GB' : LOC[S.lang], { day: 'numeric', month: 'long', year: 'numeric' });
        x.textAlign = 'left'; x.fillStyle = mute; x.font = '500 24px Figtree, sans-serif'; x.fillText('DATE', 190, 925); x.fillStyle = ink; x.font = '600 32px Figtree, sans-serif'; x.fillText(dt, 190, 970);
        x.textAlign = 'right'; x.fillStyle = mute; x.font = '500 24px Figtree, sans-serif'; x.fillText('CERTIFICATE ID', W - 190, 925); x.fillStyle = ink; x.font = '600 32px ui-monospace, Menlo, monospace'; x.fillText(c.id, W - 190, 970);
        x.textAlign = 'center'; x.fillStyle = mute; x.font = '500 21px Figtree, sans-serif'; x.fillText('Virtual certificate of completion from the Abjad Arabic app. Not an accredited qualification.', W / 2, 1040);
        const url = cv.toDataURL('image/png'); const im = $('#certimg'); if (im) im.src = url; const dl = $('#certdl'); if (dl) dl.href = url;
      }
      function certModalHTML() {
        const T = TIERS.find(x => x.id === ui.cert);
        return `<div class="sheet-back" data-act="bgmodal"><div class="sheet" role="dialog" aria-modal="true" aria-label="Certificate"><h2 style="font:700 22px var(--f-disp)">${t('{level} certificate', { level: t(T.t) })}</h2>
 <div class="field"><label for="cn">Name on certificate</label><input id="cn" type="text" value="${esc(S.name)}" maxlength="40" placeholder="Your full name" autocomplete="off"></div>
 <img id="certimg" alt="Certificate of completion" style="width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;aspect-ratio:1600/1130">
 ${window.__PWA ? '' : `<p class="small muted">Press and hold the image on a phone, or right-click it on a computer, to save it.</p>`}
 <div class="row"><button class="btn soft" data-act="copyCertId">${svg(ic.copy, 18)}Copy certificate ID</button>${window.__PWA ? `<a class="btn primary" id="certdl" download="abjad-${T.id}-certificate.png" href="#">Download PNG</a>` : ''}</div><button class="btn ghost wide" data-act="closeModal">Close</button></div></div>`;
      }
      function renderModal() { renderModal0(); if (ui.modal === 'cert') drawCert(); }

      /* views */
      function certCard() { const n = nCerts(); return `<button class="pathcard ${n ? 'sel' : ''}" data-act="openCerts"><span class="pg" style="padding:0">${svg(ic.trophy, 28)}</span><span class="pt"><b>Certificates</b><span class="muted small">${t('{a} of {b} earned', { a: n, b: TIERS.length })}</span></span>${svg(ic.chev)}</button>`; }
      function vCerts() {
        return `${backBtn()}<section class="sec"><h2>Certificates</h2><p class="muted small">Finish the tasks of a level, then pass its exam to earn a certificate of completion. Levels unlock in order.</p>
 ${TIERS.map((T, i) => {
          const f = tierInfo(i), tag = f.cert ? ['go', 'Certified'] : f.ready ? ['go', 'Ready for exam'] : !f.prev ? ['', 'Locked'] : ['', 'In progress'];
          return `<div class="card sec"><div class="row" style="justify-content:space-between"><div><h2>${t(T.t)}</h2><span class="muted small">${t(T.sub)}</span></div><span class="tag ${tag[0]}">${t(tag[1])}</span></div>
  <div class="bar"><i style="width:${Math.round(f.p * 100)}%"></i></div>
  <div>${T.reqs.map((r, k) => `<div class="rq ${f.ps[k] >= 1 ? 'ok' : ''}"><span class="bx">${svg(ic.check, 14)}</span><span>${t(r[0])}</span><small>${r[2] ? r[2]() : ''}</small></div>`).join('')}</div>
  ${f.cert ? `<div class="row"><button class="btn gold" data-act="viewCert" data-v="${T.id}">${t('View certificate')}</button></div>` : `${!f.prev ? `<p class="small muted">${t('Earn the previous certificate first.')}</p>` : ''}<button class="btn primary" data-act="startExam" data-v="${T.id}" ${f.ready ? '' : 'disabled'}>${t('Start exam')} · ${t('{n} questions · pass at {p}%', { n: T.n, p: Math.round(T.pass * 100) })}</button>`}</div>`;
        }).join('')}</section>`;
      }
      Object.assign(ACT, {
        openCerts() { go('certs'); },
        startExam(v) { startExam(v); },
        viewCert(v) { ui.cert = v; ui.modal = 'cert'; renderModal(); },
        copyCertId() { const c = S.certs[ui.cert]; if (c) copyText(c.id); }
      });
      let cnT; document.addEventListener('input', e => { if (e.target.id === 'cn') { S.name = e.target.value.slice(0, 40); save(); clearTimeout(cnT); cnT = setTimeout(() => { if (ui.modal === 'cert') drawCert(); }, 350); } });

      Object.assign(ACT, {
        ptab(v) { ui.pt = v; render(true); }, startRpg(v) { startRpg(v); }, rpgOk() { rpgDlgClose(ui.session); }, startCatch, startMatch, startBlitz,
        catchPick(v) { const s = ui.session; if (!s || s.hit) return; s.hit = true; clearTimeout(s.tm); const w = s.cur; if (v === w.id) { s.score++; beep(true); speak(w.ar); } else { s.lives--; beep(false); S.wrong[w.id] = (S.wrong[w.id] || 0) + 1; save(); } s.round++; catchRefresh(s); },
        mflip(v) { mflip(ui.session, +v); }, blitzAns(v) { blitzAns(ui.session, v); }
      });

      Object.assign(ACT, {
        openMethod() { go('method'); }, startEar, startPlacement, recToggle, recPlay,
        goGames() { ui.pt = 'games'; ACT.tab('practice'); },
        setMode(v) { S.mode = v; save(); render(true); },
        onbMode(v) { ui.onb.mode = v; renderModal(); }
      });

      document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act; if (ACT[a]) ACT[a](el.dataset.v, el, e); });
      document.addEventListener('input', e => {
        const id = e.target.id;
        if (id === 'nm') { S.name = e.target.value.slice(0, 30); save(); }
        else if (id === 'dq') { ui.dq = e.target.value; const d = $('#dres'); if (d) { d.innerHTML = dictRows(); localize(d); } }
        else if (id && id.indexOf('d-') === 0) { S.contest.draft[id.slice(2)] = e.target.value; save(); const dr = $('#draft'); if (dr) dr.textContent = draftText(); }
      });
      document.addEventListener('change', e => {
        const el = e.target; if (el.id === 'goal') { S.goal = +el.value; save(); render(true); }
        else if (el.dataset && el.dataset.goal !== undefined) { const g = +el.dataset.goal, a = S.contest.draft.goals, i = a.indexOf(g); if (el.checked && i < 0) a.push(g); if (!el.checked && i >= 0) a.splice(i, 1); save(); const dr = $('#draft'); if (dr) dr.textContent = draftText(); }
      });
      window.addEventListener('hashchange', () => render());
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (ui.modal === 'lang') ACT.closeModal(); else if (ui.sheet != null) ACT.closeSheet(); else if (ui.session) closeSession(); } });
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.installEvt = e; if (route() === 'profile') render(true); });
      window.addEventListener('online', () => { toast('Back online'); if (route() === 'profile') render(true); });
      window.addEventListener('offline', () => { toast('You are offline. Your progress is still saved.'); if (route() === 'profile') render(true); });
      if (window.__PWA && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').then(() => { ui.swOk = true; }, () => { }); } catch (e) { } }
      if (canSpeak) try { speechSynthesis.getVoices(); } catch (e) { }
      loadRows(ROWS);
      applyTheme(); applyLang();
      if (!S.onboarded) { ui.onb = { level: 'beginner', goal: 50 }; ui.modal = 'onb'; }
      render(); renderModal(); setInterval(tickCd, 20000);
    })();

  </script>
