<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Abjad Arabic</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=Reem+Kufi:wght@500..700&display=swap">
  <style>
    /* Layout concept: app shell with a left rail on desktop and a bottom tab bar on phones.
   Teal hero panels carry a star lattice taken from the Omani poster; gold is reserved for rewards and the contest. */
    :root {
      --bg: #F1F7F6;
      --surface: #FFFFFF;
      --surface2: #E7F1EF;
      --ink: #0F2A2C;
      --muted: #52706F;
      --line: #D3E3E0;
      --primary: #13807D;
      --primary-ink: #FFFFFF;
      --primary-soft: #D8EFEC;
      --hero1: #0B4548;
      --hero2: #14706F;
      --hero-ink: #F3FBFA;
      --gold: #E0A22A;
      --gold-soft: #FBEFD0;
      --gold-ink: #5A3B00;
      --gold-btn: #F0B93C;
      --gold-btn-ink: #3B2600;
      --good: #16825A;
      --good-soft: #D6F0E4;
      --bad: #C23B33;
      --bad-soft: #F9DCD9;
      --shadow: 0 1px 2px rgba(10, 40, 42, .06), 0 10px 28px rgba(10, 40, 42, .07);
      --ring-bg: var(--line);
      --ring-fg: var(--primary);
      --f-ar: 'Amiri', 'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', serif;
      --f-kufi: 'Reem Kufi', 'Amiri', 'Noto Kufi Arabic', sans-serif;
      --f-disp: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --f-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #07181A;
        --surface: #0E2326;
        --surface2: #143034;
        --ink: #E5F2F0;
        --muted: #8CADAA;
        --line: #1D3F43;
        --primary: #3DBEB7;
        --primary-ink: #052A2B;
        --primary-soft: #113539;
        --hero1: #0A3C3F;
        --hero2: #115F5F;
        --hero-ink: #F3FBFA;
        --gold: #F0B843;
        --gold-soft: #3A2D0F;
        --gold-ink: #F6D88C;
        --good: #3DC48F;
        --good-soft: #0F3A2B;
        --bad: #F0756D;
        --bad-soft: #40201D;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #07181A;
      --surface: #0E2326;
      --surface2: #143034;
      --ink: #E5F2F0;
      --muted: #8CADAA;
      --line: #1D3F43;
      --primary: #3DBEB7;
      --primary-ink: #052A2B;
      --primary-soft: #113539;
      --hero1: #0A3C3F;
      --hero2: #115F5F;
      --hero-ink: #F3FBFA;
      --gold: #F0B843;
      --gold-soft: #3A2D0F;
      --gold-ink: #F6D88C;
      --good: #3DC48F;
      --good-soft: #0F3A2B;
      --bad: #F0756D;
      --bad-soft: #40201D;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 var(--f-body);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 8px calc(92px + env(safe-area-inset-bottom, 0px))
    }

    body.lock {
      overflow: hidden
    }

    h1,
    h2,
    h3,
    p,
    ul {
      margin: 0
    }

    ul {
      padding: 0;
      list-style: none
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px
    }

    .i {
      display: block;
      flex: none
    }

    .ar {
      font-family: var(--f-ar);
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1.9
    }

    body.notr .tr {
      display: none
    }

    .shell {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr)
    }

    .main {
      min-width: 0;
      display: grid;
      gap: 16px;
      align-content: start
    }

    /* navigation */
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      gap: 4px;
      justify-content: space-around;
      padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
      background: var(--surface);
      border-top: 1px solid var(--line)
    }

    .nav button {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 2px;
      border: 0;
      background: none;
      color: var(--muted);
      font: 600 11px var(--f-body);
      border-radius: 12px
    }

    .nav .ni {
      display: grid;
      place-items: center;
      width: 44px;
      height: 28px;
      border-radius: 14px;
      transition: background .2s
    }

    .nav button.on {
      color: var(--primary)
    }

    .nav button.on .ni {
      background: var(--primary-soft)
    }

    @media (min-width:900px) {
      body {
        padding-bottom: 40px;
        padding-top: 20px
      }

      .shell {
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 28px
      }

      .nav {
        position: sticky;
        top: 20px;
        align-self: start;
        flex-direction: column;
        justify-content: flex-start;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 20px
      }

      .nav button {
        flex: none;
        flex-direction: row;
        gap: 12px;
        padding: 6px 10px 6px 6px;
        font-size: 15px;
        justify-content: flex-start
      }

      .nav .ni {
        width: 40px;
        height: 36px
      }
    }

    /* header */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      font: 700 26px/1 var(--f-kufi);
      padding-bottom: 4px
    }

    .bname {
      font: 700 22px var(--f-disp);
      letter-spacing: -.02em
    }

    .chips {
      display: flex;
      gap: 8px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font: 600 14px var(--f-body);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .chip.gold {
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-color: transparent
    }

    .chip.gold .i {
      color: var(--gold)
    }

    /* surfaces */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .card h2,
    .sec h2 {
      font: 700 19px var(--f-disp);
      letter-spacing: -.01em
    }

    .sec {
      display: grid;
      gap: 12px
    }

    .sec>h2 {
      padding: 0 2px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 14px
    }

    .eyebrow {
      font: 600 12px var(--f-body);
      letter-spacing: .09em;
      text-transform: uppercase;
      opacity: .85
    }

    .eyebrow-sm {
      font: 600 13px var(--f-body);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 12px
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 22px;
      background: linear-gradient(140deg, var(--hero1), var(--hero2));
      color: var(--hero-ink);
      --ring-bg: rgba(255, 255, 255, .2);
      --ring-fg: var(--gold-btn)
    }

    .hero>svg.geo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .14;
      pointer-events: none
    }

    .hero>*:not(.geo) {
      position: relative
    }

    .hero-row {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap
    }

    .hero-copy {
      display: grid;
      gap: 8px;
      justify-items: start;
      min-width: 0;
      flex: 1 1 240px
    }

    .hello {
      font: 700 clamp(34px, 8vw, 52px)/1.4 var(--f-ar);
      direction: rtl
    }

    .hero .sub {
      opacity: .9
    }

    .hero-ring {
      display: grid;
      justify-items: center;
      gap: 2px
    }

    .hero-ring .rl {
      font: 600 13px var(--f-body);
      opacity: .85
    }

    .ringt {
      font: 700 26px var(--f-disp);
      fill: currentColor
    }

    .hero h1.title {
      font: 700 clamp(26px, 6vw, 38px)/1.15 var(--f-disp);
      letter-spacing: -.02em
    }

    .hero .kufi {
      font: 700 clamp(30px, 7vw, 46px)/1.5 var(--f-kufi);
      direction: rtl
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 20px;
      border-radius: 14px;
      border: 1.5px solid transparent;
      font: 700 16px var(--f-body);
      text-decoration: none
    }

    .btn.primary {
      background: var(--primary);
      color: var(--primary-ink)
    }

    .btn.gold {
      background: var(--gold-btn);
      color: var(--gold-btn-ink)
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--ink)
    }

    .btn.soft {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .btn.wide {
      width: 100%
    }

    .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink)
    }

    .icon-btn.soft {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: transparent
    }

    .stat {
      display: grid;
      gap: 2px;
      padding: 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .stat b {
      font: 700 24px var(--f-disp);
      font-variant-numeric: tabular-nums
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .stat .i {
      color: var(--gold)
    }

    .wotd {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap
    }

    .wotd .big {
      font-size: 48px;
      line-height: 1.6
    }

    .bar {
      height: 10px;
      border-radius: 99px;
      background: var(--surface2);
      overflow: hidden;
      flex: 1
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--primary);
      transition: width .35s
    }

    .bar.gold i {
      background: var(--gold)
    }

    /* learn */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: none;
      color: var(--primary);
      font: 700 15px var(--f-body);
      padding: 6px 0;
      justify-self: start
    }

    .pathcard {
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: left;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow)
    }

    .pathcard .pg {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      font: 700 30px/1 var(--f-kufi);
      padding-bottom: 6px;
      flex: none
    }

    .pathcard .pt {
      display: grid;
      gap: 4px;
      min-width: 0;
      flex: 1
    }

    .pathcard b {
      font: 700 17px var(--f-disp)
    }

    .pathcard .bar {
      height: 7px
    }

    .lgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 10px
    }

    .ltile {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 0;
      padding: 8px 4px 10px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface)
    }

    .ltile .ar {
      font-size: 38px;
      line-height: 1.5
    }

    .ltile small {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap
    }

    .ltile.in::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--good)
    }

    .wrow {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .wrow .wm {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 2px
    }

    .wrow .wm b {
      font-weight: 600
    }

    .wrow .wa {
      font-size: 30px;
      line-height: 1.6;
      text-align: right;
      max-width: 46%
    }

    .dots {
      display: flex;
      gap: 3px
    }

    .dots i {
      width: 14px;
      height: 4px;
      border-radius: 3px;
      background: var(--surface2)
    }

    .dots i.on {
      background: var(--primary)
    }

    .sw {
      display: block;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line)
    }

    .dg {
      font-size: 26px;
      line-height: 1.3;
      color: var(--primary);
      min-width: 34px;
      text-align: center
    }

    .rule {
      display: grid;
      gap: 4px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface)
    }

    .rule b {
      font: 700 16px var(--f-disp)
    }

    .vrow {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .vrow .ar {
      font-size: 40px;
      line-height: 1.5;
      text-align: center
    }

    .vrow .vx {
      font-size: 30px;
      text-align: right
    }

    /* practice */
    .ptile {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: left;
      width: 100%
    }

    .ptile .pi {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      flex: none
    }

    .ptile.hot {
      background: var(--primary);
      border-color: transparent;
      color: var(--primary-ink)
    }

    .ptile.hot .pi {
      background: rgba(255, 255, 255, .18);
      color: var(--primary-ink)
    }

    .ptile .pt {
      display: grid;
      gap: 2px;
      flex: 1;
      min-width: 0
    }

    .ptile b {
      font: 700 17px var(--f-disp)
    }

    .ptile span.d {
      font-size: 14px;
      opacity: .8
    }

    .scopes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .scope {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font: 600 14px var(--f-body)
    }

    .scope.on {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink)
    }

    .stack {
      display: flex;
      height: 14px;
      border-radius: 99px;
      overflow: hidden;
      background: var(--surface2)
    }

    .stack i {
      display: block;
      height: 100%
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted)
    }

    .legend b {
      color: var(--ink);
      font-variant-numeric: tabular-nums
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
      background: var(--c)
    }

    /* profile */
    .field {
      display: grid;
      gap: 6px
    }

    .field label,
    .lab {
      font: 600 13px var(--f-body);
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase
    }

    input[type=text],
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font: 16px var(--f-body)
    }

    textarea {
      min-height: 92px;
      resize: vertical
    }

    .seg {
      display: flex;
      padding: 4px;
      border-radius: 14px;
      background: var(--surface2);
      gap: 4px
    }

    .seg button {
      flex: 1;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      background: none;
      font: 600 14px var(--f-body);
      color: var(--muted)
    }

    .seg button.on {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .12)
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      width: 100%;
      background: none;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      text-align: left
    }

    .toggle:first-of-type {
      border-top: 0
    }

    .sw-t {
      width: 46px;
      height: 28px;
      border-radius: 99px;
      background: var(--surface2);
      position: relative;
      flex: none;
      transition: background .2s
    }

    .sw-t::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      transition: transform .2s
    }

    .toggle[aria-checked=true] .sw-t {
      background: var(--primary)
    }

    .toggle[aria-checked=true] .sw-t::after {
      transform: translateX(18px)
    }

    .badges {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px
    }

    .badge {
      display: grid;
      justify-items: center;
      gap: 4px;
      text-align: center;
      padding: 14px 8px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface)
    }

    .badge .bm {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 30px/1 var(--f-kufi);
      padding-bottom: 6px;
      background: var(--gold-soft);
      color: var(--gold-ink);
      border: 2px solid var(--gold)
    }

    .badge.lock {
      opacity: .5
    }

    .badge.lock .bm {
      background: var(--surface2);
      color: var(--muted);
      border-color: var(--line);
      filter: grayscale(1)
    }

    .badge b {
      font-size: 14px
    }

    .badge small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3
    }

    /* contest */
    .cd {
      display: flex;
      gap: 10px;
      margin-top: 6px
    }

    .cd div {
      display: grid;
      justify-items: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .14);
      min-width: 72px
    }

    .cd b {
      font: 700 30px var(--f-disp);
      font-variant-numeric: tabular-nums;
      line-height: 1.1
    }

    .cd span {
      font-size: 12px;
      opacity: .85
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: end
    }

    .pod {
      display: grid;
      gap: 4px;
      justify-items: center;
      text-align: center;
      padding: 14px 8px;
      border-radius: 16px 16px 0 0;
      background: var(--primary-soft);
      color: var(--primary)
    }

    .pod b {
      font: 700 24px var(--f-disp);
      color: var(--ink)
    }

    .pod small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3
    }

    .pod .pl {
      font: 700 13px var(--f-body);
      letter-spacing: .06em
    }

    .pod.p1 {
      min-height: 176px;
      background: var(--gold-soft);
      color: var(--gold-ink)
    }

    .pod.p2 {
      min-height: 148px
    }

    .pod.p3 {
      min-height: 128px
    }

    .tl {
      display: grid;
      gap: 0
    }

    .tl li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 12px;
      padding-bottom: 18px;
      position: relative
    }

    .tl li::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 20px;
      bottom: -2px;
      width: 2px;
      background: var(--line)
    }

    .tl li:last-child::before {
      display: none
    }

    .tl .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      background: var(--surface);
      margin-top: 2px
    }

    .tl li.now .dot {
      background: var(--primary)
    }

    .tl li.gold .dot {
      border-color: var(--gold)
    }

    .tl b {
      display: block
    }

    .check {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      padding: 12px 4px;
      border: 0;
      border-top: 1px solid var(--line);
      background: none
    }

    .check:first-of-type {
      border-top: 0
    }

    .check .bx {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      flex: none;
      color: transparent;
      margin-top: 1px
    }

    .check[aria-checked=true] .bx {
      background: var(--good);
      border-color: var(--good);
      color: #fff
    }

    .check[aria-checked=true] span.t {
      color: var(--muted)
    }

    .goal {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: start
    }

    .goal .n {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold-ink);
      display: grid;
      place-items: center;
      font: 700 16px var(--f-disp)
    }

    .draft {
      white-space: pre-wrap;
      padding: 14px;
      border-radius: 14px;
      background: var(--surface2);
      font-size: 15px;
      line-height: 1.55;
      min-height: 80px
    }

    .gck {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 15px
    }

    .gck input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary)
    }

    /* session overlay */
    #session {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))
    }

    #session:empty {
      display: none
    }

    .s-wrap {
      max-width: 640px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      align-content: start;
      min-height: 100%
    }

    .s-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 12px
    }

    .s-title {
      font: 600 13px var(--f-body);
      color: var(--muted);
      white-space: nowrap
    }

    .s-body {
      display: grid;
      gap: 16px;
      align-content: start
    }

    .s-body.center {
      text-align: center;
      justify-items: center
    }

    .fcard,
    .qbox {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 26px 18px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-align: center
    }

    .fcard .big,
    .qglyph {
      font-size: 68px;
      line-height: 1.5
    }

    .fcard .big.sm {
      font-size: 48px
    }

    .fcard .ans {
      display: grid;
      gap: 2px;
      justify-items: center;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      width: 100%
    }

    .fcard .ans b {
      font: 700 22px var(--f-disp)
    }

    .qprompt {
      font: 700 28px var(--f-disp)
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
      gap: 10px
    }

    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font: 600 17px var(--f-body);
      text-align: center
    }

    .choice.ar {
      font-size: 30px;
      line-height: 1.5
    }

    .choice.ok {
      border-color: var(--good);
      background: var(--good-soft)
    }

    .choice.bad {
      border-color: var(--bad);
      background: var(--bad-soft)
    }

    .choice.dim {
      opacity: .55
    }

    .choice:disabled {
      cursor: default
    }

    .feed {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      font-weight: 600
    }

    .feed.good {
      background: var(--good-soft);
      color: var(--good)
    }

    .feed.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .grades {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .grades .btn {
      flex-direction: column;
      gap: 0;
      min-height: 58px;
      padding: 8px
    }

    .grades .btn small {
      font: 500 12px var(--f-body);
      opacity: .8
    }

    .g-again {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .g-good {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .g-easy {
      background: var(--good-soft);
      color: var(--good)
    }

    .digit {
      font-size: 56px;
      line-height: 1.3;
      color: var(--primary)
    }

    .sw.lg {
      width: 72px;
      height: 72px;
      border-radius: 20px
    }

    .tbox {
      position: relative;
      border-radius: 22px;
      border: 1.5px dashed var(--line);
      background: var(--surface);
      overflow: hidden;
      height: 300px
    }

    .tbox canvas {
      position: absolute;
      left: 0;
      top: 0
    }

    .tbox .tgv {
      opacity: .22
    }

    .tbox .tcv {
      touch-action: none;
      cursor: crosshair
    }

    .picker {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px
    }

    .picker button {
      flex: none;
      width: 48px;
      height: 52px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font: 28px/1.5 var(--f-ar)
    }

    .picker button.on {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary)
    }

    .tres {
      text-align: center;
      font-weight: 600;
      min-height: 26px
    }

    .bd-ans {
      min-height: 110px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 2px dashed var(--line);
      background: var(--surface);
      font-size: 56px;
      padding: 6px 14px;
      text-align: center
    }

    .bd-ans.ok {
      border-style: solid;
      border-color: var(--good);
      background: var(--good-soft)
    }

    .bd-ans.bad {
      border-style: solid;
      border-color: var(--bad);
      background: var(--bad-soft);
      animation: shake .35s
    }

    .bd-ans .ph {
      font: 500 15px var(--f-body);
      color: var(--muted);
      direction: ltr
    }

    .tiles {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center
    }

    .tile {
      width: 60px;
      height: 64px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font: 36px/1.5 var(--f-ar);
      box-shadow: 0 2px 0 var(--line)
    }

    .tile:disabled {
      opacity: .25
    }

    .kout {
      min-height: 130px;
      padding: 14px 18px;
      border-radius: 20px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      font-size: 44px;
      line-height: 1.8;
      word-break: break-all
    }

    .kout:empty::before {
      content: "Type here";
      font: 500 15px var(--f-body);
      color: var(--muted);
      direction: ltr;
      display: block
    }

    .kgrid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      direction: rtl
    }

    .kgrid button {
      height: 50px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font: 26px/1.4 var(--f-ar);
      padding: 0
    }

    .kgrid button.mk {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .lchips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      direction: rtl
    }

    .lchip {
      display: grid;
      justify-items: center;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted)
    }

    .lchip .ar {
      font-size: 26px;
      line-height: 1.4;
      color: var(--ink)
    }

    /* sheet + toast */
    .sheet-back {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(4, 22, 24, .6);
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--surface);
      border-radius: 26px 26px 0 0;
      padding: 20px 20px calc(22px + env(safe-area-inset-bottom, 0px));
      display: grid;
      gap: 14px;
      animation: up .25s ease-out
    }

    @media (min-width:700px) {
      .sheet-back {
        align-items: center
      }

      .sheet {
        border-radius: 26px
      }
    }

    .sheet .gl {
      font-size: 120px;
      line-height: 1.4;
      text-align: center;
      color: var(--primary)
    }

    .forms {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px
    }

    .forms div {
      display: grid;
      justify-items: center;
      padding: 8px 2px;
      border-radius: 12px;
      background: var(--surface2)
    }

    .forms .ar {
      font-size: 36px;
      line-height: 1.5
    }

    .forms small {
      font-size: 11px;
      color: var(--muted)
    }

    .exr {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--surface2)
    }

    .exr .ar {
      font-size: 34px;
      line-height: 1.5
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 20px);
      z-index: 60;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--bg);
      font: 600 15px var(--f-body);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      max-width: min(90vw, 420px);
      text-align: center
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    @media (min-width:900px) {
      #toast {
        bottom: 32px
      }
    }

    @keyframes up {
      from {
        transform: translateY(24px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    .ring {
      display: block
    }

    /* v2 additions */
    .pathcard,
    .ptile,
    .toggle,
    .check {
      text-align: start
    }

    .legend span::before {
      margin-right: 0;
      margin-inline-end: 6px
    }

    .ltile.in::after {
      left: auto;
      inset-inline-start: 8px
    }

    .tl li::before {
      left: auto;
      inset-inline-start: 10px
    }

    .sw-t::after {
      left: auto;
      inset-inline-start: 3px
    }

    [dir=rtl] .toggle[aria-checked=true] .sw-t::after {
      transform: translateX(-18px)
    }

    .wrow .wa,
    .vrow .vx {
      text-align: center
    }

    svg.fl {
      transform: none
    }

    [dir=rtl] svg.fl {
      transform: scaleX(-1)
    }

    html[data-az="1.15"] .ar {
      zoom: 1.15
    }

    html[data-az="1.3"] .ar {
      zoom: 1.3
    }

    .tool {
      display: grid;
      gap: 6px;
      justify-items: start;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      width: 100%
    }

    .tool .pi {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary)
    }

    .tool b {
      font: 700 16px var(--f-disp)
    }

    .tool span.d {
      font-size: 13px;
      color: var(--muted)
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
      gap: 10px
    }

    .stage {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      width: 100%;
      text-align: start
    }

    .stage .sn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--surface2);
      color: var(--muted);
      font: 700 17px var(--f-disp)
    }

    .stage .st {
      display: grid;
      gap: 4px;
      min-width: 0
    }

    .stage .st b {
      font: 700 16px var(--f-disp)
    }

    .stage .st .bar {
      height: 6px
    }

    .stage.next {
      border-color: var(--primary);
      box-shadow: var(--shadow)
    }

    .stage.next .sn {
      background: var(--primary);
      color: var(--primary-ink)
    }

    .stage.done .sn {
      background: var(--good-soft);
      color: var(--good)
    }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      background: var(--surface2);
      color: var(--muted);
      font: 600 11px var(--f-body);
      letter-spacing: .04em
    }

    .tag.go {
      background: var(--primary);
      color: var(--primary-ink)
    }

    .pathcard.sel {
      border-color: var(--primary);
      background: var(--primary-soft)
    }

    .bub {
      max-width: 90%;
      display: grid;
      gap: 2px;
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--line)
    }

    .bub.A {
      justify-self: start;
      border-start-start-radius: 6px
    }

    .bub.B {
      justify-self: end;
      background: var(--primary-soft);
      border-color: transparent;
      border-start-end-radius: 6px
    }

    .bub .ar {
      font-size: 28px;
      line-height: 1.6
    }

    .bub .bt {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between
    }

    .chat {
      display: grid;
      gap: 10px
    }

    .choice.col {
      flex-direction: column;
      gap: 2px;
      min-height: 70px
    }

    .choice.col .ar {
      font-size: 26px;
      line-height: 1.5
    }

    .tile.w {
      width: auto;
      min-width: 60px;
      padding: 0 14px;
      font-size: 28px
    }

    .bd-ans.sent {
      font-size: 34px
    }

    .rt {
      color: var(--primary);
      font-weight: 700
    }

    .rootbig {
      font: 700 60px/1.5 var(--f-ar);
      text-align: center;
      direction: rtl;
      letter-spacing: .2em;
      color: var(--primary)
    }

    .lesson p {
      margin: 0
    }

    .lesson ul {
      display: grid;
      gap: 8px;
      padding-inline-start: 20px;
      list-style: disc
    }

    .mini {
      width: 36px;
      height: 36px
    }

    .ob {
      display: grid;
      gap: 14px
    }

    .ob h2 {
      font: 700 24px var(--f-disp)
    }

    .langs {
      display: grid;
      gap: 8px
    }

    .langs button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font: 600 17px var(--f-body);
      text-align: start
    }

    .langs button.on {
      border-color: var(--primary);
      background: var(--primary-soft)
    }

    .langs .nm {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      display: block
    }

    textarea.code {
      min-height: 70px;
      font: 13px/1.4 ui-monospace, Menlo, monospace
    }

    .dailycard {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      background: var(--gold-soft);
      border-color: transparent
    }

    .dailycard h2,
    .dailycard .eyebrow {
      color: var(--gold-ink)
    }

    .pill-ok {
      background: var(--good-soft);
      color: var(--good)
    }

    @media (max-width:380px) {
      .bname {
        display: none
      }
    }

    .rq {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 15px
    }

    .rq:first-child {
      border-top: 0
    }

    .rq .bx {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      flex: none;
      color: transparent
    }

    .rq.ok .bx {
      background: var(--good);
      border-color: var(--good);
      color: #fff
    }

    .rq.ok>span:nth-child(2) {
      color: var(--muted)
    }

    .rq small {
      margin-inline-start: auto;
      color: var(--muted);
      font-variant-numeric: tabular-nums
    }

    .gwrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto
    }

    .gcanvas {
      display: block;
      width: 100%;
      aspect-ratio: 15/11;
      border-radius: 18px;
      border: 2px solid var(--line);
      background: #1a3a3d;
      touch-action: none
    }

    .gdlg {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      padding: 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-align: start
    }

      gap: 8px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--line)

      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .rq-body {
      display: grid;
      gap: 2px;
      min-height: 44px;
      align-content: center
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 640px;
      margin: 0 auto;
      width: 100%
    }

      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px
    }

      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 18px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none
    }

    .dpad button:active {
      background: var(--primary-soft)
    }

    .dpad [data-dir=up] {
      grid-column: 2;
      grid-row: 1
    }

    .dpad [data-dir=left] {
      grid-column: 1;
      grid-row: 2
    }

    .dpad [data-dir=down] {
      grid-column: 2;
      grid-row: 2
    }

    .dpad [data-dir=right] {
      grid-column: 3;
      grid-row: 2
    }

      width: 96px;
      height: 96px;
      border-radius: 50%;
      font-size: 17px
    }

    .mgrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px
    }

      aspect-ratio: 3/4;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      padding: 4px;
      text-align: center;
      font: 700 13px/1.2 var(--f-body);
      word-break: break-word
    }

    .mcard.back {
      font: 700 34px/1 var(--f-kufi);
      padding-bottom: 8px
    }

    .mcard.open {
      background: var(--surface);
      color: var(--ink)
    }

    .mcard.open.ar {
      font: 24px/1.5 var(--f-ar)
    }

    .mcard.done {
      background: var(--good-soft);
      color: var(--good);
      border-color: var(--good)
    }

    .gstat {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center
    }

    .heart {
      color: var(--bad)
    }

      position: relative;
      height: 340px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      overflow: hidden
    }

      position: absolute;
      top: -70px;
      width: 22%;
      min-width: 70px;
      padding: 10px 4px;
      border-radius: 16px;
      border: 1.5px solid var(--primary);
      background: var(--primary-soft);
      color: var(--ink);
      animation: fall linear forwards;
      font: inherit;
      cursor: pointer
    }

    .cbub .ar {
      font: 700 22px/1.4 var(--f-ar)
    }

    @keyframes fall {
      to {
        top: calc(100% - 4px);
        transform: translateY(0)
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cbub {
        animation-duration: 12s !important
      }
    }

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
      font: 600 12px var(--f-body);
      margin: 6px 0 10px
    }

      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--muted)
    }

      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink)
    }

    .steps5 i {
      font-style: normal;
      color: var(--muted)
    }

      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px dashed var(--line);
      margin: 10px 0
    }

      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 10px 0
    }

    .mstep .sn {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      font-weight: 700
    }

    .mstep p {
      margin: 2px 0 8px
    }

    }

    }

    }

        let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t('XP earned over the last 7 days'))}" style="display:block;max-width:460px"><g direction="ltr">`;
        s += `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W}" y="${gy - 5}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${t('goal {n}', { n: S.goal })}</text>`;
        ds.forEach((d, k) => { const h = Math.max(vals[k] ? bh * vals[k] / max : 3, 3), x = k * (bw + gap), y = top + bh - h, isT = d === tn; s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${vals[k] ? 'var(--primary)' : 'var(--surface2)'}" ${isT ? '' : 'opacity=".85"'}/>`; if (vals[k]) s += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">${vals[k]}</text>`; s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${isT ? 'var(--primary)' : 'var(--muted)'}" font-weight="${isT ? 700 : 500}" font-family="var(--f-body)">${wd[(d + 4) % 7]}</text>`; });

 <section class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:14px"><div style="min-width:0"><div class="eyebrow muted">Your learning path</div><h2>${t(nx.t)}</h2><p class="small muted">${t(nx.d)}</p></div>${ring(rm.total, 76, 8, Math.round(rm.total * 100) + '%', 17)}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="${nx.act}" ${nx.v ? `data-v="${nx.v}"` : ''}>${t(nx.cta)}</button><button class="btn ghost" data-act="tab" data-v="learn">See all steps</button></div></section>
 <section class="card dailycard"><div style="min-width:0;flex:1 1 220px"><div class="eyebrow">Daily challenge</div><h2>${dn ? t('Done for today: {n}/5', { n: S.daily.score }) : t('Five quick questions, +30 XP')}</h2></div><button class="btn ${dn ? 'ghost' : 'gold'}" data-act="startDaily">${dn ? t('Play again') : t('Start')}</button></section>

 <section class="sec"><h2>Toolbox</h2><div class="tools">

 <button class="tool" data-act="startPlacement"><span class="pi">${svg(ic.target)}</span><b>Check my level</b><span class="d">12 quick questions</span></button>
 <button class="tool" data-act="openAlpha"><span class="pi ar" style="font-size:24px;line-height:1;padding-bottom:4px">ب</span><b>Alphabet</b><span class="d">${t('{a} of 28 in your deck', { a: lc })}</span></button>
 <button class="tool" data-act="openVowels"><span class="pi ar" style="font-size:24px;line-height:1;padding-bottom:4px">بَ</span><b>Vowels and rules</b><span class="d">Read right to left</span></button>

 <button class="tool" data-act="openRoots"><span class="pi">${svg(ic.tree)}</span><b>Word roots</b><span class="d">${t('{a} of {b} passed', { a: S.done.r.length, b: ROOTS.length })}</span></button>
 <button class="tool" data-act="startBuilder" data-v="sent"><span class="pi">${svg(ic.lines)}</span><b>Sentence builder</b><span class="d">Put words in order</span></button>

 <section class="sec"><h2>Units</h2><div class="grid2">${UNITS.map(u => `<button class="pathcard" data-act="openUnit" data-v="${u.id}"><span class="pg ar" aria-hidden="true">${strip(u.ar).replace('ال', '')[0]}</span><span class="pt"><b>${u.en} <span class="ar muted" style="font-weight:400">${u.ar}</span></b><span class="muted small">${u.d}</span><span class="bar"><i style="width:${Math.round(mastery(u.id) * 100)}%"></i></span></span>${svg(ic.chev)}</button>`).join('')}</div></section>`;
      }
      function vAlpha() {

 <section class="sec"><h2>Long vowels</h2>${LONGV.map(v => `<div class="vrow"><span class="ar vx" style="text-align:center">${v[0]}</span><span><b>${v[1]}</b><br><span class="muted small">${v[2]}</span></span>${spkBtn(v[0], 1)}</div>`).join('')}
 <button class="btn primary wide" data-act="vowelsDone">${S.done.g.indexOf('vowels') >= 0 ? t('Marked as learned') : t('Mark as learned')}</button></section>`;

 <section class="sec">${u.words.map((w, i) => { const c = S.deck['w:' + id + ':' + i], b = c ? Math.min(c.b, 5) : 0; return `<div class="wrow">${viz(w[3])}${spkBtn(w[0], 1)}<div class="wm"><b>${esc(w[2])}</b><span class="tr muted small">${esc(w[1])}</span><span class="dots" aria-hidden="true">${[0, 1, 2, 3, 4].map(k => `<i class="${k < b ? 'on' : ''}"></i>`).join('')}</span></div><div class="ar wa" lang="ar">${A(w[0])}</div></div>`; }).join('')}</section>`;

 <section class="sec"><h2>Examples</h2>${g.rows.map(exRow).join('')}</section>
 <div class="row"><button class="btn primary" data-act="startGrammarQ" data-v="${id}">${t('Practice this lesson')}</button>${nx ? `<button class="btn ghost" data-act="openGL" data-v="${nx.id}">${t('Next lesson')}</button>` : ''}</div>`;

 <div class="grid2">${ROOTS.map(r => { const d = S.done.r.indexOf(r.id) >= 0; return `<button class="pathcard ${d ? 'sel' : ''}" data-act="openRoot" data-v="${r.id}"><span class="pt"><span class="ar" style="font-size:36px;line-height:1.5;color:var(--primary);letter-spacing:.15em">${r.r}</span><b>${r.tr}</b><span class="muted small">${t(r.m)}</span></span>${d ? svg(ic.check, 20) : svg(ic.chev)}</button>`; }).join('')}</div></section>`;

        return `${sHead(u.en, s.i / s.n)}<div class="s-body"><p class="eyebrow-sm">${t('Card {a} of {b}', { a: s.i + 1, b: s.n })}</p><div class="fcard">${viz(w[3], 1)}<div class="ar big sm" lang="ar">${A(w[0])}</div><div class="tr muted">${esc(w[1])}</div><h2 style="font:700 28px var(--f-disp)">${esc(w[2])}</h2>${spkBtn(w[0], 1)}</div><div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="sPrev" ${s.i ? '' : 'disabled'}>${svg(ic.left, 18)}Back</button><button class="btn primary" data-act="sNext">${s.i + 1 < s.n ? t('Next') : t('Finish')}${svg(ic.chev, 18)}</button></div></div>`;
      }

      /* --- review --- */
      function startReview() { const tn = today(); const q = shuffle(Object.keys(S.deck).filter(id => S.deck[id].d <= tn)).slice(0, 20); openSession({ type: 'review', q, i: 0, flip: false, done: 0, again: {}, xp: 0, total: q.length }); }
      function rvView(s) {
        if (!s.total) return `${sHead('Review', 1)}<div class="s-body center">${H2(Object.keys(S.deck).length ? t('You’re all caught up') : t('Your deck is empty'))}<p class="muted">${Object.keys(S.deck).length ? t('No cards are due right now. Come back later or add more words.') : t('Add the alphabet or a unit to start spaced review.')}</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="goLearn">Go to Learn</button><button class="btn ghost" data-act="closeSession">Close</button></div></div>`;
        if (s.i >= s.q.length) return `${sHead('Review', 1)}<div class="s-body center">${ring(1, 110, 10, s.done)}${H2(t('Review complete'))}<p class="muted">${t('{a} cards reviewed', { a: s.done })} · +${s.xp} XP</p><button class="btn primary" data-act="closeSession">Done</button></div>`;
        const id = s.q[s.i], c = CARDS[id], d = S.deck[id];
        const nx = g => { const b = Math.min(6, d.b + g); return INT[b] === 0 ? t('today') : t('{n}d', { n: INT[b] }); };
        return `${sHead('Review', s.i / s.q.length)}<div class="s-body"><p class="eyebrow-sm">${c.kind === 'l' ? 'Letter' : 'Word'}</p><div class="fcard">${s.flip ? viz(c.viz, 0) : ''}<div class="ar big ${c.kind === 'w' ? 'sm' : ''}" lang="ar">${c.kind === 'w' ? A(c.ar) : c.ar}</div>${spkBtn(c.ar, 1)}${s.flip ? `<div class="ans"><b>${esc(c.kind === 'l' ? c.tr : c.en)}</b><span class="muted tr">${esc(c.kind === 'l' ? c.en : c.tr)}</span></div>` : ''}</div>
 ${s.flip ? `<div class="grades"><button class="btn g-again" data-act="grade" data-v="0">Again<small>${t('today')}</small></button><button class="btn g-good" data-act="grade" data-v="1">Good<small>${nx(1)}</small></button><button class="btn g-easy" data-act="grade" data-v="2">Easy<small>${nx(2)}</small></button></div>` : `<button class="btn primary wide" data-act="flip">Show answer</button>`}</div>`;
      }

      /* --- quiz --- */
      function makeQ(c, pool) {
        if (c.kind === 'l') {
          const ty = pick(['ln', 'nl', 'fn'], 1)[0], o = pick(LETS.filter(x => x.id !== c.id), 3), all = shuffle([c].concat(o));
          if (ty === 'nl') return { hint: 'Which letter is this?', q: `<div class="qprompt">${esc(c.l.name)}</div><div class="muted">${esc(c.l.snd)}</div>`, ch: all.map(x => ({ h: x.ar, cls: 'ar', ok: x.id === c.id })), ans: c.ar, id: c.id };
          const g = ty === 'fn' ? pick(['ini', 'med', 'fin'], 1)[0] : 'iso', gl = c.l.f[g];
          return { hint: ty === 'fn' ? 'Which letter is hiding in this joined form?' : 'What is this letter called?', q: `<div class="qglyph ar">${gl}</div>`, say: c.ar, ch: all.map(x => ({ h: esc(x.l.name), ok: x.id === c.id })), ans: c.l.name, id: c.id };
        }
        const o = pick(pool.filter(x => x.id !== c.id && x.en !== c.en), 3), all = shuffle([c].concat(o));
        const ty = pick(canSpeak ? ['a2e', 'e2a', 'lis'] : ['a2e', 'e2a'], 1)[0];
        if (ty === 'a2e') return { hint: 'What does this mean?', q: `${viz(c.viz, 1)}<div class="qglyph ar" lang="ar">${A(c.ar)}</div><div class="tr muted">${esc(c.tr)}</div>${spkBtn(c.ar, 1)}`, ch: all.map(x => ({ h: esc(x.en), ok: x.id === c.id })), ans: esc(c.en), id: c.id, say: c.ar };
        if (ty === 'e2a') return { hint: 'Pick the Arabic for', q: `<div class="qprompt">${esc(c.en)}</div>`, ch: all.map(x => ({ h: A(x.ar), cls: 'ar', ok: x.id === c.id })), ans: A(c.ar), id: c.id, say: c.ar };
        return { hint: 'Listen, then pick what you heard', q: `<button class="icon-btn soft" style="width:84px;height:84px" data-act="say" data-say="${esc(c.ar)}" aria-label="Play">${svg(ic.spk, 34)}</button>`, ch: all.map(x => ({ h: A(x.ar), cls: 'ar', ok: x.id === c.id })), ans: A(c.ar), id: c.id, say: c.ar, auto: 1 };
      }
      function startQs(qs, label, meta) { openSession(Object.assign({ type: 'quiz', qs, i: 0, score: 0, picked: null, miss: [], label, xp: 0 }, meta || {})); }
      function startQuiz(scope) {
        let src, pool = WORDS, label = 'Mixed quiz';
        if (scope === 'letters') { src = LETS; label = 'Letters quiz'; }
        else if (scope === 'mix') { src = pick(WORDS, 7).concat(pick(LETS, 3)); }
        else { const u = UNITS.find(x => x.id === scope); src = WORDS.filter(c => c.unit === scope); pool = src; label = u.en; }
        src = shuffle(src).slice(0, S.mode === 'kid' ? 6 : 10);
        startQs(src.map(c => makeQ(c, pool)), label, { scope });
      }
      function startDaily() { const go = () => startQs(pick(WORDS, 3).concat(pick(LETS, 2)).map(c => makeQ(c, WORDS)), 'Daily challenge', { daily: 1, redo: go }); go(); }
      function startMistakes() {
        const ids = Object.keys(S.wrong).filter(id => CARDS[id]).slice(0, 10);

      }
      function startGrammarQ(id) { const g = GR.find(x => x.id === id); const go = () => startQs((g.q ? g.q() : pairQs(g.rows, 5)), g.t, { gid: id, redo: go }); go(); }
      function startRootQ(id) {

          qs.push(mcq('What idea sits behind this root?', `<div class="rootbig" style="font-size:44px">${r.r.split('').join(' ')}</div>`, r.m, pick(ROOTS.filter(x => x !== r).map(x => x.m), 3)));
          const w = r.w[Math.floor(Math.random() * 5)]; qs.push(mcq('What does this mean?', `<div class="qglyph ar" lang="ar">${A(w[0])}</div><div class="tr muted">${esc(w[1])}</div>`, w[2], pick(r.w.filter(x => x !== w).map(x => x[2]), 3)));

      }
      function qzView(s) {

  ${miss.length ? `<div class="card" style="width:100%;text-align:start"><h2 style="font:700 17px var(--f-disp);margin-bottom:8px">To revisit</h2>${miss.map(m => `<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span>${esc(CARDS[m.id].kind === 'l' ? CARDS[m.id].tr : CARDS[m.id].en)}</span><span class="ar" style="font-size:24px;line-height:1.5">${CARDS[m.id].kind === 'l' ? CARDS[m.id].ar : A(CARDS[m.id].ar)}</span></div>`).join('')}<button class="btn soft wide" style="margin-top:10px" data-act="addMissed">${svg(ic.plus, 18)}Add these to my deck</button></div>` : ''}
  <div class="row" style="justify-content:center"><button class="btn primary" data-act="again">Play again</button><button class="btn ghost" data-act="closeSession">Done</button></div></div>`;
        }
        const q = s.qs[s.i], a = s.picked != null, okp = a && q.ch[s.picked].ok;
        return `${sHead(t(s.label), s.i / n)}<div class="s-body"><p class="eyebrow-sm">${t(q.hint)}</p><div class="qbox">${q.q}</div>
 <div class="choices">${q.ch.map((c, k) => `<button class="choice ${c.cls || ''} ${a ? (c.ok ? 'ok' : (k === s.picked ? 'bad' : 'dim')) : ''}" data-act="choose" data-v="${k}" ${a ? 'disabled' : ''}>${c.h}</button>`).join('')}</div>
 ${a ? `<div class="feed ${okp ? 'good' : 'bad'}"><span>${okp ? (s.exam ? t('Correct') : t('Correct. +{n} XP', { n: 10 })) : t('Not quite. The answer is') + ' <span class="' + (q.ch.some(c => c.cls) ? 'ar' : '') + '" style="font-size:1.3em">' + q.ans + '</span>'}</span><button class="btn primary" data-act="qNext">${s.i + 1 < n ? t('Continue') : t('See results')}</button></div>` : ''}</div>`;
      }

      /* --- word and sentence builder --- */
      function startBuilder(kind) {
        kind = kind === 'sent' ? 'sent' : 'word'; let rounds;
        if (kind === 'word') {
          const pool = WORDS.filter(c => { const b = strip(c.ar).replace('؟', ''); return /^[ء-ي]+$/.test(b) && b.length >= 3 && b.length <= 6; });
          rounds = pick(pool, 5).map(c => { const tx = strip(c.ar), ls = tx.split('').map((ch, k) => ({ id: k, ch })); let tiles = shuffle(ls), tr = 0; while (tiles.map(x => x.ch).join('') === tx && tr++ < 6) tiles = shuffle(ls); return { t: tx, tiles, en: c.en, tr: c.tr, full: c.ar }; });
        } else rounds = pick(SENTS, 5).map(x => { const ls = x[0].map((ch, k) => ({ id: k, ch })); let tiles = shuffle(ls), tr = 0; while (tiles.map(y => y.ch).join(' ') === x[0].join(' ') && tr++ < 6) tiles = shuffle(ls); return { t: x[0].join(' '), tiles, en: x[2], tr: x[1], full: x[0].join(' ') }; });
        openSession({ type: 'builder', kind, rounds, i: 0, placed: [], status: null, hint: false, score: 0 });
      }
      function bdView(s) {
        const n = s.rounds.length, r = s.rounds[s.i], sent = s.kind === 'sent', ttl = sent ? 'Sentence builder' : 'Word builder';
        if (!r) return `${sHead(ttl, 1)}<div class="s-body center">${ring(s.score / n, 110, 10, s.score + '/' + n)}${H2(t('{a} of {b} built', { a: s.score, b: n }))}<p class="muted">+${s.score * 10} XP</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="startBuilder" data-v="${s.kind}">Play again</button><button class="btn ghost" data-act="closeSession">Done</button></div></div>`;
        const str = s.placed.map(id => r.tiles.find(x => x.id === id).ch).join(sent ? ' ' : '');
        return `${sHead(ttl, s.i / n)}<div class="s-body"><p class="eyebrow-sm">${sent ? 'Build the Arabic sentence for' : 'Build the Arabic word for'}</p><h2 style="font:700 28px var(--f-disp);text-align:center">${esc(r.en)}</h2>
 ${s.hint ? `<p class="tr muted" style="text-align:center">${esc(r.tr)}</p>` : ''}
 <div class="bd-ans ar ${sent ? 'sent' : ''} ${s.status || ''}" lang="ar">${s.status === 'ok' ? A(r.full) : (sent ? A(str) : str) || `<span class="ph">${sent ? t('Tap the words in order, starting from the right') : t('Tap the letters, starting from the right')}</span>`}</div>
 ${s.status === 'bad' ? `<p class="tres" style="color:var(--bad)">${t('Not quite. Undo or reset and try again.')}</p>` : ''}${s.status === 'ok' ? `<p class="tres" style="color:var(--good)">${t('Correct. +{n} XP', { n: 10 })} · <span class="tr">${esc(r.tr)}</span></p>` : ''}
 <div class="tiles">${r.tiles.map(x => `<button class="tile ${sent ? 'w' : ''}" data-act="bPlace" data-v="${x.id}" ${s.placed.indexOf(x.id) >= 0 || s.status === 'ok' ? 'disabled' : ''}>${sent ? A(x.ch) : x.ch}</button>`).join('')}</div>
 <div class="row" style="justify-content:center">${s.status === 'ok' ? `<button class="btn primary" data-act="bNext">${s.i < n - 1 ? t('Next') : t('Finish')}</button>` : `<button class="btn ghost" data-act="bUndo" ${s.placed.length ? '' : 'disabled'}>${svg(ic.back, 18)}Undo</button><button class="btn ghost" data-act="bReset">Reset</button><button class="btn ghost" data-act="bHint">Hint</button><button class="btn ghost" data-act="bSkip">Skip</button>`}${spkBtn(r.full)}</div></div>`;
      }

      /* --- dialogue --- */
      const lineOf = ar => { for (const d of DL) for (const l of d.lines) if (l.ar === ar) return l; };
      function prepDlg(s) { const ln = s.d.lines[s.i]; s.tried = []; s.ok = false; s.opts = null; if (ln && ln.w === 'B') { const oth = []; DL.forEach(d => d.lines.forEach(l => { if (l.w === 'B' && l.ar !== ln.ar && oth.indexOf(l.ar) < 0) oth.push(l.ar); })); s.opts = shuffle([ln.ar].concat(pick(oth, 2))); } }
      function startDialog(id) { const s = { type: 'dlg', d: DL.find(x => x.id === id), i: 0, en: false }; prepDlg(s); openSession(s); }
      const bub = (l, s) => `<div class="bub ${l.w}"><div class="bt"><span class="ar" lang="ar">${A(l.ar)}</span>${spkBtn(l.ar, 1)}</div><span class="tr muted small">${esc(l.tr)}</span>${s.en ? `<span class="small">${esc(l.en)}</span>` : ''}</div>`;
      function dgView(s) {
        const L2 = s.d.lines, n = L2.length;
        if (s.i >= n) return `${sHead(t(s.d.t), 1)}<div class="s-body center"><div class="logo" style="width:72px;height:72px;font-size:44px;background:var(--gold-btn);color:var(--gold-btn-ink)">✓</div>${H2(t('Dialogue complete'))}<p class="muted">${s.xpGot ? '+' + s.xpGot + ' XP' : ''}</p><div class="chat" style="width:100%;text-align:start">${L2.map(l => bub(l, { en: true })).join('')}</div><div class="row" style="justify-content:center"><button class="btn primary" data-act="startDialog" data-v="${s.d.id}">${t('Play again')}</button><button class="btn ghost" data-act="closeSession">Done</button></div></div>`;
        const ln = L2[s.i], you = ln.w === 'B';
        return `${sHead(t(s.d.t), s.i / n)}<div class="s-body"><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="dEn">${s.en ? t('Hide translation') : t('Show translation')}</button></div>
 <div class="chat">${L2.slice(0, s.i).map(l => bub(l, s)).join('')}${!you ? bub(ln, s) : ''}${you && s.ok ? bub(ln, s) : ''}</div>
 ${you && !s.ok ? `<p class="eyebrow-sm">${t('Choose your reply')}${s.en ? ' · ' + esc(ln.en) : ''}</p><div class="choices">${s.opts.map((o, k) => { const l = lineOf(o); return `<button class="choice col ${s.tried.indexOf(k) >= 0 ? 'bad' : ''}" data-act="dChoose" data-v="${k}" ${s.tried.indexOf(k) >= 0 ? 'disabled' : ''}><span class="ar" lang="ar">${A(o)}</span><small class="tr muted">${esc(l.tr)}</small></button>`; }).join('')}</div>${s.tried.length ? `<div class="feed bad">${t('Not quite. Try another reply.')}</div>` : ''}` : `<button class="btn primary wide" data-act="dNext">${s.i + 1 < n ? t('Continue') : t('Finish')}</button>`}</div>`;
      }

      /* ============ Word Quest (top-down RPG) ============ */
      const TS = 32, MW = 15, MH = 11, CW = MW * TS, CH = MH * TS;
      const cardAr = ar => WORDS.find(c => c.ar === ar);
      const M_HOME = ['###############', '#b.b.......b.b#', '#.............#', '#..p.......p..#', '#.............#', '#...tt...tt...#', '#.............#', '#.p.........p.#', '#.............#', '#.............#', '###############'];
      const M_CAFE = ['###############', '#bbbbbbbbbbbbb#', '#.............#', '#.tttttttttt..#', '#.............#', '#..tt.....tt..#', '#.............#', '#..tt.....tt..#', '#.p.........p.#', '#.............#', '###############'];
      const M_SOUQ = ['###############', '#.............#', '#.tt..tt..tt..#', '#.tt..tt..tt..#', '#.............#', '#.p.........p.#', '#..tt..tt..tt.#', '#..tt..tt..tt.#', '#.............#', '#.............#', '###############'];
      const M_AIR = ['###############', '#.............#', '#.bb.......bb.#', '#.............#', '#..tt..tt..tt.#', '#.............#', '#..tt..tt..tt.#', '#.............#', '#.p.........p.#', '#.............#', '###############'];
      const QUEST = [
        { id: 'home', n: 1, t: 'Grandma’s house', glyph: 'ب', map: M_HOME, pal: { f1: '#EBDCB9', f2: '#E2D1A9', wall: '#7A5C3A', deco: '#A9743F', acc: '#D9534F' }, npc: { name: 'Jadda', color: '#B5527F', x: 7, y: 2 }, tpl: ['أُرِيدُ', 'urīdu', 'I want:', ''], words: ['مِفْتَاح', 'كُرْسِيّ', 'طَاوِلَة', 'بَاب'], decoy: ['سَرِير', 'نَافِذَة'] },
        { id: 'cafe', n: 2, t: 'The café', glyph: 'ق', map: M_CAFE, pal: { f1: '#E7D3C0', f2: '#DEC6AE', wall: '#5E3B2B', deco: '#8A5A3C', acc: '#2F9E8F' }, npc: { name: 'Layla', color: '#2F7FB5', x: 7, y: 2 }, tpl: ['مِنْ فَضْلِكَ،', 'min faḍlika,', 'Please:', ''], words: ['قَهْوَة', 'شَاي', 'حَلِيب', 'خُبْز'], decoy: ['مَاء', 'تَمْر'] },
        { id: 'souq', n: 3, t: 'The souq', glyph: 'س', map: M_SOUQ, pal: { f1: '#EFDDB0', f2: '#E6D19D', wall: '#8A5A2B', deco: '#C9792F', acc: '#B8392F' }, npc: { name: 'Abu Omar', color: '#8A5CC2', x: 7, y: 1 }, tpl: ['أُرِيدُ', 'urīdu', 'I want:', ''], words: ['تُفَّاح', 'سَمَك', 'أُرُزّ', 'لَحْم'], decoy: ['تَمْر', 'خُبْز'] },
        { id: 'air', n: 4, t: 'The airport', glyph: 'ط', map: M_AIR, pal: { f1: '#DCE6EA', f2: '#D0DCE1', wall: '#3F5C6B', deco: '#6F8FA0', acc: '#E0A22A' }, npc: { name: 'Captain Sami', color: '#2E5E8C', x: 7, y: 1 }, tpl: ['أَيْنَ', 'ayna', 'Where is:', '؟'], words: ['فُنْدُق', 'شَاطِئ', 'سُوق', 'سَيَّارَة'], decoy: ['مَطَار', 'طَرِيق'] }
      ];
      const rpgView = s => `${sHead(t(s.q.t), 0)}<div class="s-body"><div id="rpghud" class="rpg-hud"></div><div class="gwrap"><canvas id="rpgc" class="gcanvas" aria-label="Game map"></canvas><div id="rpgdlg" class="gdlg" hidden></div></div><div class="gpad" dir="ltr"><div class="dpad"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="right" aria-label="Right">▶</button><button data-dir="down" aria-label="Down">▼</button></div><button class="btn gold talk" id="rpgtalk">Talk</button></div><p class="small muted" style="text-align:center">Move with arrow keys or WASD. Press E or Space to talk. On a phone, use the pad and the Talk button.</p></div>`;
      function startRpg(id) {
        const q = QUEST.find(x => x.id === id);

        const free = []; q.map.forEach((row, y) => row.split('').forEach((c, x) => { if (c === '.' && y >= 2 && Math.abs(x - q.npc.x) + Math.abs(y - q.npc.y) >= 3 && Math.abs(x - 7) + Math.abs(y - 9) >= 2) free.push([x, y]); }));

      /* --- trace --- */
      const TFORMS = [['iso', 'Alone'], ['ini', 'Start'], ['med', 'Middle'], ['fin', 'End']];
      function startTrace(i) { ui.sheet = null; renderSheet(); openSession({ type: 'trace', li: +i, form: 'iso' }); }
      function trView(s) {
        const l = L[s.li];
        return `${sHead('Trace letters', 0)}<div class="s-body"><div class="seg" role="group" aria-label="Letter form">${TFORMS.map(f => `<button class="${s.form === f[0] ? 'on' : ''}" data-act="tForm" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>
 <div class="tbox"><canvas id="tgv" class="tgv"></canvas><canvas id="tcv" class="tcv" aria-label="Drawing area"></canvas></div>
 <div class="tres" id="tres">${esc(l.name)} · ${t('trace over the pale guide with your finger or mouse.')}</div>
 <div class="row" style="justify-content:center"><button class="btn ghost" data-act="tClear">Clear</button><button class="btn primary" data-act="tCheck">Check my tracing</button>${spkBtn(l.ch, 1)}</div>
 <div class="picker" role="group" aria-label="Choose a letter">${L.map(x => `<button class="${x.i === s.li ? 'on' : ''}" data-act="tLetter" data-v="${x.i}" aria-label="${esc(x.name)}">${x.ch}</button>`).join('')}</div></div>`;
      }
      const TH = 300; let TW = 340, TD = 1;
      function glyphDraw(x, text, dil) { x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.font = '230px Amiri, "Noto Naskh Arabic", serif'; const m = x.measureText(text); const y = TH / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2; if (dil) { x.lineWidth = 46; x.lineJoin = 'round'; x.strokeText(text, TW / 2, y); } x.fillText(text, TW / 2, y); }
      function initTrace() {
        const cv = $('#tcv'), gv = $('#tgv'); if (!cv) return;
        const wrap = cv.parentElement; TW = Math.max(260, wrap.clientWidth || 340); TD = Math.min(window.devicePixelRatio || 1, 2.5);
        [cv, gv].forEach(c => { c.width = Math.round(TW * TD); c.height = Math.round(TH * TD); c.style.width = TW + 'px'; c.style.height = TH + 'px'; });
        const draw = () => { const g = gv.getContext('2d'); g.setTransform(TD, 0, 0, TD, 0, 0); g.clearRect(0, 0, TW, TH); g.fillStyle = getComputedStyle(document.body).color; glyphDraw(g, L[ui.session.li].f[ui.session.form], false); };
        draw(); if (document.fonts && document.fonts.load) document.fonts.load('230px Amiri', 'ب').then(() => { if ($('#tgv') === gv) draw(); }).catch(() => { });
        const x = cv.getContext('2d'); x.setTransform(TD, 0, 0, TD, 0, 0); x.lineWidth = 18; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#13807D';
        let down = false;
        const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (TW / r.width), (e.clientY - r.top) * (TH / r.height)]; };
        cv.addEventListener('pointerdown', e => { down = true; cv.setPointerCapture(e.pointerId); const p = pt(e); x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(p[0] + .01, p[1]); x.stroke(); e.preventDefault(); });
        cv.addEventListener('pointermove', e => { if (!down) return; const p = pt(e); x.lineTo(p[0], p[1]); x.stroke(); x.beginPath(); x.moveTo(p[0], p[1]); });
        const up = () => { down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
      }
      function checkTrace() {
        const s = ui.session, cv = $('#tcv'); if (!cv) return;
        const W = cv.width, H = cv.height, u = cv.getContext('2d').getImageData(0, 0, W, H).data, text = L[s.li].f[s.form];
        const mk = dil => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.setTransform(TD, 0, 0, TD, 0, 0); x.fillStyle = '#000'; x.strokeStyle = '#000'; glyphDraw(x, text, dil); return x.getImageData(0, 0, W, H).data; };
        const gl = mk(false), dl = mk(true); let gt = 0, gc = 0, ut = 0, us = 0;
        for (let i = 3; i < u.length; i += 4) { const a = gl[i] > 60, b = dl[i] > 60, c = u[i] > 60; if (a) { gt++; if (c) gc++; } if (c) { ut++; if (!b) us++; } }
        if (ut < 150 || !gt) { $('#tres').textContent = t('Trace the letter first, then check.'); return; }
        const sc = Math.max(0, Math.min(100, Math.round(100 * (.7 * gc / gt + .3 * (1 - us / ut)))));
        const msg = t(sc >= 80 ? 'Beautiful' : sc >= 60 ? 'Good work' : 'Keep following the guide');
        let xp = ''; if (sc >= 60) { addXP(5); xp = ' · +5 XP'; beep(true); } else beep(false);
        if (sc >= 80) { S.stats.trace80++; save(); }
        $('#tres').innerHTML = `${msg}: ${t('{n}% match', { n: sc })}${xp}`;
      }

        startStudy(v) { startStudy(v); }, startReview() { startReview(); }, startQuiz(v) { startQuiz(v); }, startBuilder(v) { startBuilder(v); }, startTrace(v) { startTrace(v); }, startKeys() { startKeys(); },
        startDaily() { startDaily(); }, startMistakes() { startMistakes(); }, startGrammarQ(v) { startGrammarQ(v); }, startRootQ(v) { startRootQ(v); }, startDialog(v) { startDialog(v); },
        closeSession() { closeSession(); },

        sNext() { const s = ui.session; if (s.i + 1 < s.n) s.i++; else { const u = UNITS.find(x => x.id === s.unit); u.words.forEach((_, i) => addDeck('w:' + s.unit + ':' + i)); S.stats.lessons++; addXP(20); beep(true); s.done = true; } renderSession(); },

        grade(v) {

          else { c.b = Math.min(6, c.b + g); c.d = today() + INT[c.b]; addXP(3); s.xp += 3; beep(true); }
          S.stats.reviews++; s.done++; s.i++; s.flip = false; if (s.i >= s.q.length) { addXP(10); s.xp += 10; } save(); renderSession();

          if (q.ch[s.picked].ok) { s.score++; if (!s.exam) { s.xp += 10; addXP(10); } beep(true); if (q.id && S.wrong[q.id]) { S.wrong[q.id]--; if (S.wrong[q.id] <= 0) delete S.wrong[q.id]; save(); } }
